title: Compilation Into Or Execution From Temporary Location Of Freshly Built Binary
id: 83b223c7-74b2-4f69-8176-778628a0ff7b
status: experimental
description: |
    Detects the execution of a binary with the compiler default output name "a.out", or a C/C++/Go compiler invoked on sources or with an output located in a world-writable directory such as "/tmp", "/var/tmp" or "/dev/shm".
    Adversaries deliver source code (e.g. local privilege escalation exploits or implants) and compile it on the target to evade static detection of delivered binaries.
    Hunt for compilations on hosts that are not build or developer machines, especially when the compiler runs under a web service, an interactive SSH session or a non-developer account, and for an "a.out" or freshly built binary executed shortly afterwards.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1027.004/T1027.004.md
author: elhoim
date: 2026-10-01
tags:
    - attack.stealth
    - attack.t1027.004
    - detection.threat-hunting
logsource:
    product: linux
    category: process_creation
detection:
    selection_aout:
        Image|endswith: '/a.out'
    selection_compiler_img:
        - Image|endswith:
              - '/c++'
              - '/cc'
              - '/clang'
              - '/clang++'
              - '/g++'
              - '/gcc'
              - '/go'
              - '/tcc'
        # Debian/Ubuntu resolve gcc, g++, cc and c++ to versioned target-triplet binaries such as /usr/bin/x86_64-linux-gnu-gcc-15
        - Image|re: '-linux-gnu-(gcc|g\+\+)-[0-9]+$'
    selection_compiler_cli:
        CommandLine|contains:
            - ' /dev/shm/'
            - ' /tmp/'
            - ' /var/tmp/'
    filter_optional_build_tools:
        # Work directories of language toolchains and package builds that invoke the C compiler (cgo, pip C extensions, rustc linking), required together with the toolchain as parent process
        ParentImage|re: '/(cargo|go|python[0-9.]*|rustc)$'
        CommandLine|re: ' /tmp/(go-build[0-9]+/b[0-9]+/|pip-[a-z-]+-[A-Za-z0-9_]+/|rustc[A-Za-z0-9]+/)'
    condition: selection_aout or (all of selection_compiler_* and not 1 of filter_optional_*)
falsepositives:
    - Developers compiling and testing code in temporary directories
    - Build systems and package builds using temporary directories (e.g. pip building C extensions)
    - Go builds using cgo, which invoke gcc on files in the "/tmp/go-build*" work directory
    - Builds started by another parent (for example make or a shell script) in the "/tmp/go-build*", "/tmp/pip-*" or "/tmp/rustc*" directories are not filtered
level: low
simulation:
    - type: atomic-red-team
      name: C compile
      technique: T1027.004
      atomic_guid: d0377aa6-850a-42b2-95f0-de558d80be57
    - type: atomic-red-team
      name: CC compile
      technique: T1027.004
      atomic_guid: da97bb11-d6d0-4fc1-b445-e443d1346efe
