title: Okta User Password Pushed to Application
id: a38d00b4-ccc2-438b-998d-ced74f4b469f
status: experimental
description: |
    Detects when Okta pushes a user's password, including the user's Okta password, to an application through provisioning.
    An attacker with administrative access may configure an application, such as a SCIM application under their control, to synchronise user passwords in order to harvest credentials.
    Use this rule to hunt for applications that unexpectedly receive user passwords.
references:
    - https://developer.okta.com/docs/reference/api/event-types/
    - https://docs.datadoghq.com/security/default_rules/def-000-dgs/
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.persistence
    - attack.defense-impairment
    - attack.t1556
    - detection.threat-hunting
logsource:
    product: okta
    service: okta
detection:
    selection:
        eventType:
            - 'application.provision.user.push_okta_password'
            - 'application.provision.user.push_password'
    condition: selection
falsepositives:
    - Applications legitimately configured to synchronise user passwords through provisioning
level: low
