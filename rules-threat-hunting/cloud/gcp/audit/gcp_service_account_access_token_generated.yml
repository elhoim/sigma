title: GCP Service Account Short-Lived Access Token Generated
id: 3920b3fa-74e7-4fa5-8c6e-fa867c1375d4
status: experimental
description: |
    Detects the generation of a short-lived OAuth 2.0 access token for a service account through the IAM Service Account Credentials API.
    This is how a principal impersonates a service account, and adversaries may abuse it to move laterally or escalate privileges using the permissions of the impersonated account.
    The "GenerateAccessToken" method is recorded in Data Access audit logs, which must be enabled for the IAM Service Account Credentials API.
references:
    - https://cloud.google.com/iam/docs/audit-logging/examples-service-accounts
    - https://cloud.google.com/iam/docs/service-account-impersonation
    - https://docs.datadoghq.com/security/default_rules/h56-k5y-xp3/
author: elhoim
date: 2026-10-15
tags:
    - attack.stealth
    - attack.persistence
    - attack.privilege-escalation
    - attack.initial-access
    - attack.t1078.004
    - detection.threat-hunting
logsource:
    product: gcp
    service: gcp.audit
detection:
    selection:
        data.protoPayload.serviceName: 'iamcredentials.googleapis.com'
        data.protoPayload.methodName: 'GenerateAccessToken'
    condition: selection
falsepositives:
    - Legitimate service account impersonation by workloads, CI/CD pipelines and administrators, which is common in many environments
level: low
