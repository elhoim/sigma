title: Privileged Local Group Membership Enumerated By Uncommon Caller Process
id: 0202aae5-5cb5-4aa9-988a-d3eb5a7aec73
status: experimental
description: |
    Detects the enumeration of the members of the local Administrators or Remote Desktop Users group (Security event 4799) by a caller process that is not one of the Windows components that routinely perform this lookup.
    Reconnaissance tools and post-exploitation frameworks enumerate these groups to find privileged accounts and lateral movement targets; the event records the enumerating process in CallerProcessName.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4799
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/discovery_privileged_localgroup_membership.toml
author: elhoim
date: 2026-11-10
tags:
    - attack.discovery
    - attack.t1069.001
    - detection.threat-hunting
logsource:
    product: windows
    service: security
    definition: 'Requirements: Audit Policy : Account Management > Audit Security Group Management'
detection:
    selection:
        EventID: 4799
        TargetSid:
            - 'S-1-5-32-544' # Administrators
            - 'S-1-5-32-555' # Remote Desktop Users
    filter_main_no_caller:
        CallerProcessName: '-'
    filter_main_windows_components:
        CallerProcessName:
            - 'C:\Windows\System32\CloudExperienceHostBroker.exe'
            - 'C:\Windows\System32\CompatTelRunner.exe'
            - 'C:\Windows\System32\dfsrs.exe'
            - 'C:\Windows\System32\diskshadow.exe'
            - 'C:\Windows\System32\dllhost.exe'
            - 'C:\Windows\System32\esentutl.exe'
            - 'C:\Windows\System32\inetsrv\w3wp.exe'
            - 'C:\Windows\System32\mmc.exe'
            - 'C:\Windows\System32\msiexec.exe'
            - 'C:\Windows\System32\mstsc.exe'
            - 'C:\Windows\System32\net1.exe'
            - 'C:\Windows\System32\Netplwiz.exe'
            - 'C:\Windows\System32\oobe\msoobe.exe'
            - 'C:\Windows\System32\RecoveryDrive.exe'
            - 'C:\Windows\System32\RuntimeBroker.exe'
            - 'C:\Windows\System32\SearchIndexer.exe'
            - 'C:\Windows\System32\SettingSyncHost.exe'
            - 'C:\Windows\System32\SrTasks.exe'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\System32\SystemPropertiesComputerName.exe'
            - 'C:\Windows\System32\taskhostw.exe'
            - 'C:\Windows\System32\VSSVC.exe'
            - 'C:\Windows\System32\vssadmin.exe'
            - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
            - 'C:\Windows\System32\wsmprovhost.exe'
            - 'C:\Windows\SysWOW64\msiexec.exe'
            - 'C:\Windows\ImmersiveControlPanel\SystemSettings.exe'
    filter_main_setup:
        CallerProcessName|re: '^C:\\\$WINDOWS\.~BT\\Sources\\[^\\]+\.exe$'
    filter_optional_backup_agents:
        # Anchored full paths in non-world-writable locations only
        CallerProcessName|re:
            - '^C:\\Windows\\VeeamVssSupport\\(?:[^\\]+\\)*[^\\]+\.exe$'
            - '^C:\\WindowsAzure\\(?:[^\\]+\\)*[^\\]+\.exe$'
    condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
    - Administrators running "net localgroup administrators" (caller net1.exe is excluded) or management agents that inventory local groups; baseline CallerProcessName per environment
    - Rubrik VMware agents running from C:\Windows\Temp\rubrik_vmware (not excluded because that directory is writable; add an environment-specific exclusion for the exact binary)
    - PowerShell cmdlets such as Get-LocalGroup that also read group member SIDs and so generate the same event, and SYSTEM or service-account tasks run from PowerShell (SYSTEM is deliberately not excluded)
level: medium
regression_tests_path: regression_data/rules-threat-hunting/windows/builtin/security/win_security_privileged_local_group_membership_enumerated_uncommon_caller/info.yml
