title: Potential Cloud Access Token Or Secret Retrieval Via Cloud CLI
id: b98a5770-14ad-484b-8575-ba00fdd37d91
status: experimental
description: |
    Detects command lines of cloud and Kubernetes CLIs (gcloud, az, azd, aws, gh, kubectl), or of a shell or interpreter wrapping them, that print a usable access token, export the configured credentials or dump stored secrets in clear text.
    Attackers who land on a developer workstation or a CI runner run these commands to harvest the tokens cached by the logged-in CLI sessions instead of stealing credential files from disk, as the compromised Nx npm package did with "gh auth token".
    These commands are common on developer machines and in automation. Use the rule for hunting and baseline the known identities, parent processes and runner images.
references:
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/cross-platform/credential_access_multi_cloud_cli_token_harvesting.toml
    - https://www.stepsecurity.io/blog/supply-chain-security-alert-popular-nx-build-system-package-compromised-with-data-stealing-malware
    - https://cloud.google.com/sdk/gcloud/reference/auth/print-access-token
    - https://learn.microsoft.com/en-us/cli/azure/account?view=azure-cli-latest#az-account-get-access-token
    - https://cli.github.com/manual/gh_auth_token
    - https://docs.aws.amazon.com/cli/latest/reference/configure/export-credentials.html
    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_config/kubectl_config_view/
author: elhoim
date: 2026-11-09
tags:
    - attack.credential-access
    - attack.t1528
    - attack.t1552
    - attack.t1552.001
    - detection.threat-hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection_token:
        CommandLine|contains:
            # Google Cloud SDK
            - 'auth print-access-token'
            - 'auth print-identity-token'
            - 'application-default print-access-token'
            - 'config config-helper'
            - 'secrets versions access'
            # Azure CLI, Azure Developer CLI and Az PowerShell
            - 'account get-access-token'
            - 'Get-AzAccessToken'
            - 'keyvault secret show'
            # GitHub CLI and Azure Developer CLI
            - ' auth token'
            - 'auth status --show-token'
            # AWS CLI
            - 'sts get-session-token'
            - 'sts assume-role'
            - 'sts get-federation-token'
            - 'configure export-credentials'
            - 'configure get aws_secret_access_key'
            - 'configure get aws_session_token'
            - 'secretsmanager get-secret-value'
    selection_kubeconfig:
        # Prints the embedded client keys and tokens instead of "DATA+OMITTED"
        CommandLine|contains|all:
            - 'config view'
            - '--raw'
    selection_k8s_secret_cmd:
        CommandLine|contains: 'get secret'
    selection_k8s_secret_output:
        CommandLine|contains:
            - '-o json'
            - '-o yaml'
            - '-o=json'
            - '-o=yaml'
            - '-ojson'
            - '-oyaml'
            - 'go-template'
            - 'jsonpath'
            - '--output'
    condition: selection_token or selection_kubeconfig or all of selection_k8s_secret_*
falsepositives:
    - Developers, administrators and platform engineers retrieve tokens and secrets with these commands as part of their daily work
    - CI/CD runners, infrastructure-as-code tools, credential helpers and IDE extensions that obtain tokens from the local CLI session
    - Google credential helpers (docker-credential-gcloud, gke-gcloud-auth-plugin) running "gcloud config config-helper", and Terraform providers running "az account get-access-token"
level: medium
regression_tests_path: regression_data/rules-threat-hunting/windows/process_creation/proc_creation_win_cloud_cli_token_and_secret_retrieval/info.yml
