title: Shell Or LOLBin Child Process Of VS Code Extension Host
id: 6ea9500b-99c0-493a-84e1-86991e9d7a3e
status: experimental
description: |
    Detects a shell, scripting host, download utility or other living-off-the-land binary started by the Visual Studio Code extension host, identified by a "Code.exe" or "node.exe" parent whose command line references the extensions folder or the extension host entry point.
    Malicious extensions published to the marketplace or the Open VSX registry execute on editor start-up and have been observed dropping remote access tools (for example the fake "Clawdbot" extension installing ScreenConnect) or running PowerShell download cradles.
    Legitimate extensions also run "cmd.exe /d /s /c" (the Node.js exec() wrapper) for routine probes such as interpreter discovery or process clean-up, and those commands resolve from the working directory or PATH, so they cannot be excluded safely; use this rule to hunt and baseline the extensions in use.
references:
    - https://www.aikido.dev/blog/fake-clawdbot-vscode-extension-malware
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/initial_access_suspicious_execution_from_vscode_extension.toml
author: elhoim
date: 2026-11-10
tags:
    - attack.command-and-control
    - attack.execution
    - attack.initial-access
    - attack.stealth
    - attack.t1059.001
    - attack.t1059.003
    - attack.t1059.007
    - attack.t1105
    - attack.t1195.002
    - attack.t1218.005
    - attack.t1218.007
    - attack.t1218.011
    - detection.threat-hunting
logsource:
    category: process_creation
    product: windows
detection:
    selection_parent_img:
        ParentImage|endswith:
            - '\Code.exe'
            - '\node.exe'
    selection_parent_cli:
        - ParentCommandLine|contains: 'extensionHost'
        - ParentCommandLine|contains|all:
              - 'vscode'
              - 'extensions'
    selection_img:
        - Image|endswith:
              - '\bitsadmin.exe'
              - '\cmd.exe'
              - '\cscript.exe'
              - '\curl.exe'
              - '\mshta.exe'
              - '\msiexec.exe'
              - '\powershell.exe'
              - '\pwsh.exe'
              - '\rundll32.exe'
              - '\wscript.exe'
        - OriginalFileName:
              - 'bitsadmin.exe'
              - 'Cmd.Exe'
              - 'cscript.exe'
              - 'curl.exe'
              - 'MSHTA.EXE'
              - 'msiexec.exe'
              - 'PowerShell.EXE'
              - 'pwsh.dll'
              - 'RUNDLL32.EXE'
              - 'wscript.exe'
    condition: all of selection_*
falsepositives:
    - Extensions that run shell commands at activation or during use (the Python and Pylance extensions probing interpreters through "cmd.exe /d /s /c" or ending processes with taskkill, language servers, Git helpers, build tools, the PowerShell extension starting its console host)
level: low
regression_tests_path: regression_data/rules-threat-hunting/windows/process_creation/proc_creation_win_vscode_extension_host_susp_child_process/info.yml
