title: Kerberos Ticket Enumeration Via Klist From Shell Or Script Host
id: 96d0a055-7f7c-49f1-8d88-9b2b336f2643
status: experimental
description: |
    Detects the Kerberos ticket utility "klist.exe" being started by a command shell or a script host (cmd, powershell, pwsh, wscript, cscript, mshta).
    klist lists the cached Kerberos tickets and sessions of the current logon; in the LeakNet ClickFix campaign the in-memory JavaScript payload ran klist through a shell to inventory the victim's tickets before further Kerberos abuse. Administrators run klist interactively to troubleshoot authentication, so this is a hunting signal to be combined with the parent script or the surrounding activity.
references:
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/klist
    - https://github.com/ByteRay-Labs/Query-Hub/blob/a453fcb09118894840a4e00b0db0f9807ba8441d/queries/leaknet_campaign_deno_runtime_klist_suspicious_execution_detection.yml
author: elhoim
date: 2026-11-09
tags:
    - attack.discovery
    - attack.credential-access
    - attack.t1087
    - attack.t1558
    - detection.threat-hunting
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\klist.exe'
        ParentImage|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
    condition: selection
falsepositives:
    - Administrators troubleshooting Kerberos authentication (klist, klist purge) from an interactive shell
level: low
regression_tests_path: regression_data/rules-threat-hunting/windows/process_creation/proc_creation_win_klist_execution_from_shell_or_script_host/info.yml
