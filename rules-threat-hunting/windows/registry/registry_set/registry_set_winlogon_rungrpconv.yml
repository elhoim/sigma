title: Winlogon RunGrpConv Registry Value Set
id: c658778a-e0d5-41bf-843d-b5ef5d24971d
status: experimental
description: |
    Detects the creation of the "RunGrpConv" value in the Winlogon registry key.
    On legacy Windows versions, the value makes the logon process start the Program Manager group converter "grpconv.exe" at the next logon, which legacy installers use to finalize the creation of program groups.
    Malware has set the value together with a planted "grpconv.exe" or a DLL that it loads in order to get code executed at logon.
references:
    - https://www.hexacorn.com/blog/2014/06/18/beyond-good-ol-run-key-part-13/
author: elhoim
date: 2026-11-12
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1547.004
    - detection.threat-hunting
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith: '\Microsoft\Windows NT\CurrentVersion\Winlogon\RunGrpConv'
    condition: selection
falsepositives:
    - Legacy installers and INF based setups that request a program group conversion
level: low
regression_tests_path: regression_data/rules-threat-hunting/windows/registry/registry_set/registry_set_winlogon_rungrpconv/info.yml
