title: Account Created And Deleted By Non Approved Users
id: c98184ba-4a27-4e10-b7b7-da48e71f4d25
status: test
description: Detects accounts that are created or deleted by non-approved users.
references:
    - https://docs.microsoft.com/en-us/azure/active-directory/fundamentals/security-operations-user-accounts#short-lived-accounts
author: Mark Morowczynski '@markmorow', MikeDuddington, '@dudders1', elhoim - David André (correction)
date: 2022-08-11
modified: 2026-09-24
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1078
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message:
            - Add user
            - Delete user
        Status: Success
    filter_main_approved:
        properties.initiatedBy|contains|expand: '%ApprovedUserUpn%'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Legit administrative action
level: medium
