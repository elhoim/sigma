title: Root Account Password Changed Via Passwd
id: 19eb59f4-98be-492c-b1ee-0ad5e5a565ed
status: experimental
description: |
    Detects the "passwd" utility being used to change the password of the "root" account.
    Adversaries who obtained root privileges may set a known root password to maintain access, or change it to lock legitimate administrators out of the system.
references:
    - https://man7.org/linux/man-pages/man1/passwd.1.html
    - https://docs.datadoghq.com/security/default_rules/def-000-rph/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
    - attack.impact
    - attack.t1531
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|endswith: '/passwd'
        CommandLine|endswith: ' root'
    filter_main_status:
        CommandLine|contains:
            - ' -S'
            - ' --status'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Legitimate root password rotation by administrators
level: medium
