title: Cloud Instance Metadata Credentials Requested Via CommandLine
id: 862e5e13-713d-4a26-92be-52bf6560e241
status: experimental
description: |
    Detects a process whose command line requests temporary cloud credentials from an instance metadata service (AWS, GCP, Azure or Alibaba Cloud), for example "curl http://169.254.169.254/latest/meta-data/iam/security-credentials/<role>".
    Cloud SDKs and agents query the metadata service internally rather than through command-line utilities, so a shell utility such as curl, wget or a one-liner fetching these endpoints is often a sign of an attacker harvesting the instance role credentials after gaining code execution.
references:
    - https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
    - https://cloud.google.com/compute/docs/access/authenticate-workloads#applications
    - https://learn.microsoft.com/en-us/entra/identity/managed-identities-azure-resources/how-to-use-vm-token
    - https://docs.datadoghq.com/security/default_rules/kzv-bta-ny6/
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1552.005
logsource:
    category: process_creation
    product: linux
detection:
    selection_host:
        CommandLine|contains:
            - '100.100.100.200' # Alibaba Cloud
            - '169.254.169.254'
            - 'fd00:ec2::254'
            - 'metadata.google.internal'
    selection_path:
        CommandLine|contains:
            - '/identity/oauth2/token' # Azure managed identity
            - '/instance/service-accounts/' # GCP
            - '/security-credentials' # AWS and Alibaba Cloud
    condition: all of selection_*
falsepositives:
    - Bootstrap or user-data scripts that retrieve instance role credentials with curl or wget
level: medium
