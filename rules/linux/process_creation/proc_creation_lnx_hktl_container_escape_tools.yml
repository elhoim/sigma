title: Suspicious Container Escape Enumeration Tool Or Container Runtime Socket Abuse
id: bdac3544-7fd7-49db-9ed6-d732690c26f2
status: experimental
description: |
    Detects the execution of well-known container breakout and enumeration tools (DEEPCE, CDK, amicontained, Break Out The Box), as well as command-line HTTP clients sending data or exec/create requests directly to a container runtime socket (Docker, containerd or CRI-O). Read-only queries such as listing containers or reading the version are not matched.
    Adversaries who have gained access to a container use these tools to enumerate capabilities, mounts and runtime sockets, and abuse a mounted runtime socket to start a privileged container and escape to the host.
references:
    - https://github.com/stealthcopter/deepce
    - https://github.com/cdk-team/CDK
    - https://github.com/genuinetools/amicontained
    - https://github.com/brompwnie/botb
    - https://docs.docker.com/reference/api/engine/
author: elhoim
date: 2026-10-15
tags:
    - attack.discovery
    - attack.privilege-escalation
    - attack.t1611
    - attack.t1613
logsource:
    category: process_creation
    product: linux
detection:
    selection_tools_image:
        - Image|endswith:
              - '/amicontained'
              - '/botb'
              - '/deepce.sh'
        - Image|contains:
              - '/botb-linux'
              - '/cdk_linux'
    selection_tools_cli:
        CommandLine|contains: 'deepce.sh'
    selection_cdk_cli:
        Image|endswith: '/cdk'
        CommandLine|contains:
            - ' auto-escape'
            - ' eva'
            - ' run shim-pwn'
            - ' run mount-cgroup'
            - ' run mount-disk'
    selection_socket_client:
        CommandLine|contains: '--unix-socket'
    selection_socket_path:
        CommandLine|contains:
            - 'containerd.sock'
            - 'crio.sock'
            - 'docker.sock'
    selection_socket_action:
        # Creating, running or building containers through the socket is what the escape needs; read-only queries (version, ping, container list) are monitoring
        - CommandLine|contains:
              - '/build'
              - '/containers/create'
              - '/exec'
              - '/images/create'
              - '/start'
        - CommandLine|re: '\s(-[a-zA-Z]*[dFTX]|--(data|form|json|request|upload-file))'
    condition: 1 of selection_tools_* or selection_cdk_cli or all of selection_socket_*
falsepositives:
    - Authorized container security assessments
    - Deployment or orchestration scripts that create or exec containers through the Docker Engine API on its UNIX socket with curl
level: high
