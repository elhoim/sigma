title: Potential Private Key Material Discovery Or Collection Via CLI - Linux
id: 98576949-8bd9-4d9b-8555-b0e55571b0e3
status: experimental
description: |
    Detects command line utilities searching for, copying or archiving private key material such as SSH private keys, GnuPG keyrings, WireGuard configurations or TLS private key files.
    Also detects dumping the private key of a WireGuard interface via "wg showconf" or "wg show <interface> private-key".
    Adversaries collect private keys to authenticate to other systems, decrypt data or impersonate services.
references:
    - https://www.man7.org/linux/man-pages/man8/wg.8.html
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1552.004/T1552.004.md
author: elhoim
date: 2026-10-01
tags:
    - attack.credential-access
    - attack.t1552.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_tools_img:
        Image|endswith:
            - '/base64'
            - '/cat'
            - '/cp'
            - '/find'
            - '/gnucp' # Ubuntu 25.10+ (rust-coreutils): /usr/bin/cp resolves to /usr/bin/gnucp
            - '/locate'
            - '/plocate'
            - '/rsync'
            - '/scp'
            - '/tar'
            - '/zip'
    selection_tools_cli:
        CommandLine|contains:
            - '.gnupg'
            - '/etc/wireguard'
    selection_tools_key:
        # Private key names that are not followed by ".pub" (public keys are not secret)
        CommandLine|re: 'id_(dsa|ecdsa|ed25519|rsa)($|[^.]|\.$|\.[^p]|\.p$|\.p[^u]|\.pu$|\.pu[^b])'
    selection_tools_key_twice:
        # Two private key references: one of them is copied or read, not only used as identity file
        CommandLine|re: 'id_(dsa|ecdsa|ed25519|rsa)($|[^.]|\.$|\.[^p]|\.p$|\.p[^u]|\.pu$|\.pu[^b]).*id_(dsa|ecdsa|ed25519|rsa)($|[^.]|\.$|\.[^p]|\.p$|\.p[^u]|\.pu$|\.pu[^b])'
    selection_find_img:
        Image|endswith:
            - '/find'
            - '/locate'
            - '/plocate'
    selection_find_cli:
        CommandLine|contains:
            - '.key'
            - '.p12'
            - '.pem'
            - '.pfx'
            - '.ppk'
    selection_wg_img:
        Image|endswith: '/wg'
    selection_wg_cli:
        - CommandLine|contains: ' showconf'
        - CommandLine|contains|all:
              - ' show '
              - ' private-key'
    filter_optional_public_ca_store:
        # "find" whose only search roots are the system CA stores, which hold public certificates only
        Image|endswith: '/find'
        CommandLine|re: '^\S*find\s+((/etc/pki/ca-trust|/etc/ssl/certs|/usr/share/ca-certificates)(/[A-Za-z0-9_/-]*)?\s+)+-[^/]*$'
    filter_optional_ssh_identity_option:
        # Using a private key as identity file ("scp -i", "rsync -e 'ssh -i'") authenticates with the key but does not copy it
        - Image|endswith: '/scp'
          CommandLine|re: '\s-i\s+\S*id_(dsa|ecdsa|ed25519|rsa)(_sk)?(\s|$)'
        - Image|endswith: '/rsync'
          CommandLine|re: '\s-e\s+ssh\s+(-\S+\s+)*-i\s+\S*id_(dsa|ecdsa|ed25519|rsa)(_sk)?(\s|$)'
    condition: (selection_tools_img and (selection_tools_cli or (selection_tools_key and (not filter_optional_ssh_identity_option or selection_tools_key_twice)))) or (all of selection_find_* and not filter_optional_public_ca_store) or all of selection_wg_*
falsepositives:
    - Backup jobs or configuration management copying user home directories or key material
    - Administrators locating or saving WireGuard configurations (e.g. "wg-quick save")
    - Certificate inventory or expiry checks that search for ".pem" or ".key" files
    - Administrators reading "/etc/wireguard" files or backing up the "~/.gnupg" directory
level: medium
