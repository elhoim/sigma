title: eBPF Uprobe Targeting PAM Authentication Library
id: aa48fc10-9bfb-42d3-852c-8f0e89a5f4f0
status: experimental
description: |
    Detects the execution of bpftrace with a probe definition that references the PAM library or its credential handling functions, or the execution of the "pamspy" tool.
    Adversaries with root privileges may attach an eBPF uprobe to "libpam.so" functions such as "pam_get_authtok" to capture cleartext passwords of users authenticating through sudo, sshd, su or login, without modifying any file on disk.
    This rule only covers loaders whose probe target is visible on the command line; custom eBPF loaders require kernel-level BPF telemetry.
references:
    - https://github.com/citronneur/pamspy
    - https://github.com/bpftrace/bpftrace
    - https://docs.datadoghq.com/security/default_rules/def-000-0kg/
author: elhoim
date: 2026-10-15
tags:
    - attack.collection
    - attack.credential-access
    - attack.t1056
    - attack.defense-impairment
    - attack.persistence
    - attack.t1556.003
logsource:
    category: process_creation
    product: linux
detection:
    selection_bpftrace_img:
        Image|endswith: '/bpftrace'
    selection_bpftrace_cli:
        CommandLine|contains:
            - 'libpam'
            - 'pam_get_authtok'
    selection_pamspy:
        Image|endswith: '/pamspy'
    condition: all of selection_bpftrace_* or selection_pamspy
falsepositives:
    - Developers or administrators debugging PAM authentication with bpftrace
level: high
