title: Potential HTTP Tunnel Webshell File Creation - ReGeorg, Neo-reGeorg, Suo5 - Linux
id: 19437dc1-6fcf-4889-84f9-78d429c5d98b
related:
    - id: 3dfdf05f-3159-46d1-aae4-cfb9ff53bde9
      type: similar
status: experimental
description: |
    Detects the creation by a web server or application server process of a file carrying one of the default names of the server-side components of the reGeorg, Neo-reGeorg and suo5 HTTP tunnelling tools ("tunnel.php", "tunnel.nosocket.php", "tunnel.jsp", "tunnel.jspx", "tunnel.aspx", "tunnel.ashx", "suo5.jsp", "suo5.jspx", "suo5.php", "suo5.aspx") inside a web content directory.
    These web shells turn a compromised web server into a SOCKS proxy. This is the Linux counterpart of the Windows file creation rule; the web server access log rule only covers reGeorg request patterns.
references:
    - https://github.com/LOTTunnels/LOTTunnels.github.io/blob/d6fc42602ff543595b49b6f735f1e353be66bc35/_lottunnels/Binaries/neo-regeorg.md
    - https://github.com/LOTTunnels/LOTTunnels.github.io/blob/d6fc42602ff543595b49b6f735f1e353be66bc35/_lottunnels/Binaries/regeorg.md
    - https://github.com/LOTTunnels/LOTTunnels.github.io/blob/d6fc42602ff543595b49b6f735f1e353be66bc35/_lottunnels/Binaries/suo5.md
author: elhoim
date: 2026-11-13
tags:
    - attack.command-and-control
    - attack.persistence
    - attack.t1090
    - attack.t1505.003
    - attack.t1572
logsource:
    category: file_event
    product: linux
detection:
    selection_image_exact:
        Image|endswith:
            - '/apache2'
            - '/httpd'
            - '/nginx'
            - '/java'
    selection_image_php:
        Image|contains: '/php'
    selection_name:
        TargetFilename|endswith:
            - '/tunnel.php'
            - '/tunnel.nosocket.php'
            - '/tunnel.jsp'
            - '/tunnel.jspx'
            - '/tunnel.aspx'
            - '/tunnel.ashx'
            - '/suo5.jsp'
            - '/suo5.jspx'
            - '/suo5.php'
            - '/suo5.aspx'
    selection_webroot:
        TargetFilename|contains:
            - '/var/www/'
            - '/srv/www/'
            - '/usr/share/nginx/'
            - '/htdocs/'
            - '/webapps/'
    condition: 1 of selection_image_* and selection_name and selection_webroot
falsepositives:
    - Web applications that legitimately ship a page named "tunnel" (some VPN or proxy management portals)
level: medium
regression_tests_path: regression_data/rules/linux/file_event/file_event_lnx_webshell_http_tunnel_regeorg_suo5/info.yml
