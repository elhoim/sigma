title: Potential Linux Account Credential Files Modification By Uncommon Process
id: 48909c50-aa3d-4498-a4fa-692c00b6bf8e
status: experimental
description: |
    Detects the creation or modification of the Linux local account databases "/etc/passwd", "/etc/shadow", "/etc/group" and "/etc/gshadow" by a process that is not one of the standard account management utilities or package managers.
    Adversaries may directly edit these files to add a backdoor account, set a known password hash or grant UID 0 to an existing user, bypassing the usual tooling.
references:
    - https://man7.org/linux/man-pages/man5/shadow.5.html
    - https://man7.org/linux/man-pages/man8/vipw.8.html
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1003.008
    - attack.t1098
logsource:
    category: file_event
    product: linux
detection:
    selection:
        TargetFilename:
            - '/etc/group'
            - '/etc/gshadow'
            - '/etc/passwd'
            - '/etc/shadow'
    filter_main_account_tools:
        Image|re: '^/(usr/)?s?bin/(chage|chfn|chgpasswd|chpasswd|chsh|gpasswd|groupadd|groupdel|groupmod|grpconv|grpunconv|newusers|passwd|pwconv|pwunconv|useradd|userdel|usermod|vigr|vipw)$'
    filter_main_package_managers:
        Image|re: '^/(usr/)?s?bin/(apk|apt|apt-get|dnf|dpkg|pacman|rpm|yum|zypper)$'
    filter_main_systemd:
        Image|re: '^/(usr/)?(s?bin|lib/systemd)/(systemd-sysusers|systemd-userdbd)$'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Configuration management tools (Ansible, Puppet, Chef, Salt) or cloud-init writing these files directly
    - Administrators editing the files manually with a text editor
level: medium
