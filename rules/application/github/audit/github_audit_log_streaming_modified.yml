title: Github Audit Log Streaming Configuration Modified Or Deleted
id: 5cf6372e-e70b-4a47-951b-9897afda2de5
status: experimental
description: |
    Detects when the audit log streaming configuration of a GitHub enterprise is updated or deleted.
    Adversaries may tamper with audit log streaming to prevent their actions from reaching security monitoring.
references:
    - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise
    - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise
author: elhoim
date: 2026-10-15
tags:
    - attack.defense-impairment
    - attack.t1685.002
logsource:
    product: github
    service: audit
    definition: 'Requirements: The audit log streaming feature must be enabled to be able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
    selection:
        action:
            - 'audit_log_streaming.destroy'
            - 'audit_log_streaming.update'
    condition: selection
falsepositives:
    - Legitimate rotation of streaming credentials or change of SIEM destination
level: high
