title: GitHub Activity From Secret Hunting Tool User-Agent
id: 35a3f08c-be14-4c13-9794-542461570dea
status: experimental
description: |
    Detects GitHub audit log events generated by requests using the default user-agent of known secret hunting and CI/CD secret extraction tools such as TruffleHog or Nord Stream.
    Threat actors use these tools with stolen tokens to harvest credentials from repositories and CI/CD pipelines.
references:
    - https://github.com/trufflesecurity/trufflehog/blob/d870725e59c74b2ba6dd313eefb7a34f206269c7/pkg/common/http.go
    - https://github.com/synacktiv/nord-stream/blob/c9dc22de906dfbcd5466e695679ccd33f4676aad/nordstream/utils/constants.py
    - https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1552.001
    - attack.discovery
    - attack.t1526
logsource:
    product: github
    service: audit
    definition: 'Requirements: The audit log streaming feature must be enabled to be able to receive such logs. You can enable following the documentation here: https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/streaming-the-audit-log-for-your-enterprise#setting-up-audit-log-streaming'
detection:
    selection_trufflehog:
        user_agent|contains: 'TruffleHog'
    selection_nordstream:
        # Hardcoded default user-agent of Nord Stream
        user_agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36'
        action: 'api.request'
    condition: 1 of selection_*
falsepositives:
    - Authorized secret scanning performed by the security team using TruffleHog.
    - The Nord Stream user-agent is a static Chrome 118 browser string that could in rare cases be used by other API clients.
level: high
