title: Kubernetes Attach To Running Container
id: 56d72f84-2169-42d0-af61-fce6decd4caa
status: experimental
description: |
    Detects attaching to a running container in a pod (e.g. "kubectl attach").
    Adversaries may attach to the main process of a container to interact with it, similar to exec.
references:
    - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_attach/
author: elhoim
date: 2026-10-15
tags:
    - attack.execution
    - attack.t1609
logsource:
    category: application
    product: kubernetes
    service: audit
detection:
    selection:
        verb: 'create'
        objectRef.resource: 'pods'
        objectRef.subresource: 'attach'
    condition: selection
falsepositives:
    - Legitimate debugging activity. Investigate the identity performing the requests and their authorization.
level: medium
