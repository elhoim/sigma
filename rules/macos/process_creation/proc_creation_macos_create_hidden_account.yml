title: Hidden User Creation
id: b22a5b36-2431-493a-8be1-0bae56c28ef3
status: test
description: Detects creation of a hidden user account on macOS (UserID < 500) or with IsHidden option
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.002/T1564.002.md
author: Daniil Yugoslavskiy, oscd.community, elhoim - David André (correction)
date: 2020-10-10
modified: 2026-09-24
tags:
    - attack.stealth
    - attack.t1564.002
logsource:
    category: process_creation
    product: macos
detection:
    dscl_create:
        Image|endswith: '/dscl'
        CommandLine|contains: 'create'
    id_below_500:
        CommandLine|re|i: 'UniqueID\s+[''"]?(?:[0-9]|[1-9][0-9]|[1-4][0-9]{2})[''"]?(?:\s|$)'
    ishidden_option:
        CommandLine|re|i: 'IsHidden\s+[''"]?(?:true|yes|1)[''"]?(?:\s|$)'
    condition: dscl_create and (id_below_500 or ishidden_option)
falsepositives:
    - Legitimate administration activities
level: medium
