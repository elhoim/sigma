title: Potential RDP Lateral Movement Tooling - Mstscax.DLL Loaded By Uncommon Process
id: 5faeed98-ad94-42f5-a146-7495d583205a
status: experimental
description: |
    Detects the Remote Desktop Services ActiveX client library "mstscax.dll" being loaded by a process other than the built-in Remote Desktop clients, when that process runs from the Windows directory, a public or default user profile, ProgramData, PerfLogs, Intel or a network share.
    Tools such as SharpRDP embed the RDP ActiveX control to authenticate to a remote host and run commands over RDP without an interactive session; the control is otherwise only loaded by mstsc.exe and a few Hyper-V and sandbox clients.
references:
    - https://www.elastic.co/security-labs/hunting-for-lateral-movement-using-event-query-language
    - https://github.com/0xthirteen/SharpRDP/blob/0a2de235e46538b738ad518587c189a8e46e4413/README.md
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/lateral_movement_suspicious_rdp_client_imageload.toml
author: elhoim
date: 2026-11-09
tags:
    - attack.lateral-movement
    - attack.t1021.001
logsource:
    product: windows
    category: image_load
detection:
    selection:
        ImageLoaded|endswith: '\mstscax.dll'
    selection_uncommon_path:
        - Image|contains:
              - ':\Windows\'
              - ':\Users\Public\'
              - ':\Users\Default\'
              - ':\Intel\'
              - ':\PerfLogs\'
              - ':\ProgramData\'
              - '\Device\Mup\'
        - Image|startswith: '\\'
    filter_main_rdp_clients:
        Image:
            - 'C:\Windows\System32\mstsc.exe'
            - 'C:\Windows\SysWOW64\mstsc.exe'
            - 'C:\Windows\System32\vmconnect.exe'
            - 'C:\Windows\System32\WindowsSandboxClient.exe'
            - 'C:\Windows\System32\hvsirdpclient.exe'
    condition: all of selection* and not 1 of filter_main_*
falsepositives:
    - Remote management or virtualization clients installed under ProgramData or run from a network share; add them to the filter
    - On Windows 7, a service host (svchost.exe) loading the system copy of the control for Remote Desktop and RemoteApp connections; the event carries no field that tells it apart from an injected service host, so it is not filtered
level: medium
regression_tests_path: regression_data/rules/windows/image_load/image_load_dll_mstscax_uncommon_process_load/info.yml
