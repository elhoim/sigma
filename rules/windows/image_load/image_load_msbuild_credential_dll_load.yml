title: Potential Credential Access Via MSBuild Loading Credential Libraries
id: 26261160-c218-40fc-aa7e-9cbb09f265cb
status: experimental
description: |
    Detects the Microsoft Build Engine (MSBuild.exe) loading the Windows Credential Manager library "vaultcli.dll" or the SAM client library "samlib.dll".
    MSBuild is a trusted developer utility that compiles and runs inline C# or Visual Basic tasks; attackers use it as a proxy to execute credential dumping code that enumerates the Credential Vault or the Security Account Manager without dropping a separate tool.
references:
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/credential_access_credential_dumping_msbuild.toml
    - https://lolbas-project.github.io/lolbas/Binaries/Msbuild/
    - https://github.com/redcanaryco/atomic-red-team/blob/da9a2b2a16fe60943ef8aed16da5b49cd0dc1593/atomics/T1127.001/T1127.001.md
author: elhoim
date: 2026-11-09
tags:
    - attack.credential-access
    - attack.execution
    - attack.stealth
    - attack.t1003.002
    - attack.t1127.001
    - attack.t1555.004
logsource:
    category: image_load
    product: windows
detection:
    selection:
        Image|endswith: '\MSBuild.exe'
        ImageLoaded|endswith:
            - '\samlib.dll'
            - '\vaultcli.dll'
    condition: selection
falsepositives:
    - Build tasks or package credential providers that read credentials from the Windows Credential Manager during a build
level: medium
regression_tests_path: regression_data/rules/windows/image_load/image_load_msbuild_credential_dll_load/info.yml
