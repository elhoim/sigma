title: Potential Print Spooler Exploitation - SPL File Created By Uncommon Process
id: 2efaa747-3c04-43e8-9746-feafbb41752a
status: experimental
description: |
    Detects the creation of a spool file (".spl") in "System32\spool\PRINTERS" by a process other than the Print Spooler and its helper processes, printing-related system binaries, applications installed under Program Files or the user's explorer.
    Spool files are normally written by spoolsv.exe on behalf of printing applications; a .spl written directly by a script host, a user-dropped tool or a shell is the staging step of the PrintDemon family of local privilege escalations (CVE-2020-1048, CVE-2020-1337), where a crafted spool job is replayed by the spooler as SYSTEM to write an arbitrary file.
references:
    - https://windows-internals.com/printdemon-cve-2020-1048/
    - https://www.safebreach.com/blog/how-we-bypassed-cve-2020-1048-patch-and-got-cve-2020-1337/
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/privilege_escalation_printspooler_suspicious_spl_file.toml
author: elhoim
date: 2026-11-09
tags:
    - attack.privilege-escalation
    - attack.t1068
logsource:
    product: windows
    category: file_event
detection:
    selection:
        TargetFilename|contains: ':\Windows\System32\spool\PRINTERS\'
        TargetFilename|endswith: '.spl'
    filter_main_spooler_processes:
        Image:
            - 'C:\Windows\System32\spoolsv.exe'
            - 'C:\Windows\System32\printfilterpipelinesvc.exe'
            - 'C:\Windows\System32\PrintIsolationHost.exe'
            - 'C:\Windows\System32\splwow64.exe'
            - 'C:\Windows\splwow64.exe'
            - 'C:\Windows\System32\msiexec.exe'
            - 'C:\Windows\SysWOW64\msiexec.exe'
            - 'C:\Windows\System32\poqexec.exe'
    filter_main_system:
        Image: 'System'
    filter_main_known_paths:
        Image|startswith:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
            - 'C:\PROGRA~1\'
            - 'C:\PROGRA~2\'
    filter_main_known_system_binaries:
        Image:
            - 'C:\Windows\System32\mmc.exe'
            - 'C:\Windows\System32\svchost.exe'
            - 'C:\Windows\System32\printui.exe'
            - 'C:\Windows\System32\mstsc.exe'
            - 'C:\Windows\System32\rundll32.exe'
            - 'C:\Windows\explorer.exe'
            - 'C:\Windows\System32\mspaint.exe'
            - 'C:\Windows\System32\SnippingTool.exe'
            - 'C:\Windows\System32\notepad.exe'
            - 'C:\Windows\System32\xpsrchvw.exe'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Portable or user-profile installed applications, including per-user installed browsers, that print directly; add them to the filters by full path
    - Processes running as SYSTEM other than the Print Spooler that write spool files
level: medium
regression_tests_path: regression_data/rules/windows/file/file_event/file_event_win_print_spooler_spl_file_by_uncommon_process/info.yml
