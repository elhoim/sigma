title: Potential ROT Encoded Python Script Execution - Codec Bytecode Creation
id: 5a75fc35-fbd3-4672-86d7-ed22775f391c
status: experimental
description: |
    Detects a Python interpreter writing the compiled bytecode of the standard library "rot_13" text-transform codec (rot_13.cpython-*.pyc in an encodings\__pycache__ directory).
    The codec is compiled on first import, which happens when a script decodes a ROT-13 obfuscated payload through the codecs module. Legitimate programs rarely use this codec, so the bytecode file appearing on a host is an artefact of an obfuscated script being run, as seen in malicious PyPI packages and Python loaders.
references:
    - https://docs.python.org/3/library/codecs.html#text-transforms
    - https://www.elastic.co/security-labs/dprk-code-of-conduct
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/cross-platform/defense_evasion_encoding_rot13_python_script.toml
author: elhoim
date: 2026-11-10
tags:
    - attack.execution
    - attack.stealth
    - attack.t1027.013
    - attack.t1059.006
    - attack.t1140
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|re|i: '\\pythonw?[0-9.]*\.exe$' # python.exe, pythonw.exe and versioned names such as python3.12.exe
        TargetFilename|contains|all:
            - '\encodings\__pycache__\rot_13.cpython-'
            - '.pyc'
    condition: selection
falsepositives:
    - Python installation or upgrade that precompiles the standard library (compileall), and Conda or Google Cloud SDK bootstrap scripts that do the same
level: medium
regression_tests_path: regression_data/rules/windows/file/file_event/file_event_win_python_rot_codec_bytecode_creation/info.yml
