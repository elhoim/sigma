title: Suspicious UAC Bypass DLL Written By DllHost Via IFileOperation
id: 584b1157-4bef-443f-bf16-3734e7f7231b
related:
    - id: 68578b43-65df-4f81-9a9b-92f32711a951
      type: similar
    - id: a5ea83a7-05a5-44c1-be2e-addccbbd8c03
      type: similar
status: experimental
description: |
    Detects dllhost.exe writing a DLL whose name belongs to the set of libraries that auto-elevated Windows programs load from their own directory (wow64log.dll, comctl32.dll, DismCore.dll, OskSupport.dll, duser.dll, Accessibility.ni.dll).
    The elevated IFileOperation COM object hosted by dllhost.exe lets a medium-integrity process copy files into protected folders without a UAC prompt; UAC bypass tooling uses it to plant one of these DLLs next to an auto-elevating executable, which then side-loads it with high integrity.
    Windows servicing writes these DLLs only under WinSxS and SoftwareDistribution, which are excluded.
references:
    - https://www.elastic.co/security-labs/exploring-windows-uac-bypasses-techniques-and-detection-strategies
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/privilege_escalation_uac_bypass_dll_sideloading.toml
author: elhoim
date: 2026-11-10
tags:
    - attack.privilege-escalation
    - attack.t1548.002
logsource:
    category: file_event
    product: windows
detection:
    selection:
        Image|endswith: '\dllhost.exe'
        TargetFilename|endswith:
            - '\Accessibility.ni.dll'
            - '\comctl32.dll'
            - '\DismCore.dll'
            - '\duser.dll'
            - '\OskSupport.dll'
            - '\wow64log.dll'
    filter_main_servicing:
        TargetFilename|startswith:
            - 'C:\Windows\SoftwareDistribution\'
            - 'C:\Windows\WinSxS\'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Unlikely
level: high
regression_tests_path: regression_data/rules/windows/file/file_event/file_event_win_dllhost_uac_bypass_sideload_dll_write/info.yml
