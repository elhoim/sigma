title: Potential Masquerading - Executable Content Written To File With Media Or Document Extension
id: 50a92e9c-419e-4764-b310-12aa671dac47
related:
    - id: 693a44e9-7f26-4cb6-b787-214867672d3a
      type: derived
status: experimental
description: |
    Detects a Sysmon "FileExecutableDetected" event (a file whose content starts with the PE "MZ" header) for a file whose extension claims an image, audio, video, text or document format (.jpg, .png, .gif, .mp3, .mp4, .txt, .pdf, .doc, .xls, .html, .inf...).
    Malware stages its payloads under harmless-looking extensions to pass email, proxy and allow-list controls and to hide among user data, then renames or maps them at run time; a legitimate media or document file never begins with a PE header.
references:
    - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
    - https://learn.microsoft.com/en-us/windows/win32/debug/pe-format
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules_building_block/defense_evasion_masquerading_unusual_exe_file_extension.toml
author: elhoim
date: 2026-11-10
tags:
    - attack.stealth
    - attack.t1036.008
logsource:
    product: windows
    category: file_executable_detected
    definition: 'Requirements: Sysmon 15 or later with FileExecutableDetected (EID 29) enabled for the monitored paths'
detection:
    selection:
        TargetFilename|endswith:
            - '.jpg'
            - '.jpeg'
            - '.png'
            - '.gif'
            - '.bmp'
            - '.tiff'
            - '.emf'
            - '.svg'
            - '.eps'
            - '.fpx'
            - '.inf'
            - '.mp3'
            - '.wav'
            - '.avi'
            - '.mpeg'
            - '.flv'
            - '.wma'
            - '.wmv'
            - '.mov'
            - '.mp4'
            - '.3gp'
            - '.txt'
            - '.pdf'
            - '.doc'
            - '.docx'
            - '.rtf'
            - '.ppt'
            - '.pptx'
            - '.xls'
            - '.xlsx'
            - '.hwp'
            - '.html'
    condition: selection
falsepositives:
    - Software that stores packed executables or installers under a non-executable extension in its own data folders (some game launchers and updaters); add the path to a filter
    - Files written by the System process, for example over SMB, are not excluded; a masqueraded executable delivered over a network share is a true detection
level: medium
regression_tests_path: regression_data/rules/windows/file/file_executable_detected/file_executable_detected_win_media_or_document_extension/info.yml
