title: Potential Credential Validation Via DirectoryEntry LDAP Bind With Explicit Credentials
id: ab7bf17a-4105-4361-9a0d-11d463cf8755
related:
    - id: b29a93fb-087c-4b5b-a84d-ee3309e69d08
      type: similar
    - id: 1883444f-084b-419b-ac62-e0d0c5b3693f
      type: similar
status: experimental
description: |
    Detects a PowerShell script block that constructs a "System.DirectoryServices.DirectoryEntry" object with an "LDAP://" path and an explicit username and password, and then forces the bind with "RefreshCache" or "NativeObject" or sets an explicit "AuthenticationTypes" value.
    Binding to the directory with supplied credentials is how scripts test whether a password is valid without an interactive logon; password-spraying and credential-validation tooling loops this pattern over account lists, producing bursts of 4625/4771/4776 events on the domain controllers. Legitimate scripts rarely bind with hard-coded or variable credentials instead of the current security context.
references:
    - https://github.com/TheMagicClaw/LOLAPI/blob/da78421569588bd30f1254bd1c0dc493fb3985c4/yaml/f4de2c0c-5ff2-4f85-ba3f-908676328776.yaml
    - https://learn.microsoft.com/en-us/dotnet/api/system.directoryservices.directoryentry
author: elhoim
date: 2026-11-09
tags:
    - attack.credential-access
    - attack.t1110.001
    - attack.t1110.003
logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    selection_bind:
        ScriptBlockText|re|i: 'DirectoryEntry\s*\(\s*["''$][^,]*LDAP://[^,]*,\s*[^,]+,\s*[^,)]+'
    selection_force:
        ScriptBlockText|contains:
            - '.RefreshCache('
            - '.NativeObject'
            - 'AuthenticationTypes]::'
    condition: all of selection_*
falsepositives:
    - Service account scripts or web applications validating user passwords against Active Directory
    - Identity management and self-service password tools
level: medium
regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_directoryentry_ldap_bind_with_explicit_credentials/info.yml
