title: Potential SQL Injection Patterns In MSSQL Audit Log
id: f673a323-8448-4627-b882-6c7f51100757
status: experimental
description: |
    Detects Microsoft SQL Server audit events (Event ID 33205) whose audited statement contains typical SQL injection payload patterns, such as stacked CHAR() concatenation used to obfuscate strings, "UNION SELECT NULL,NULL,..." column enumeration, boolean-based "CASE WHEN (n=n)" or "OR 1=1--" conditions and "@@VERSION" extraction.
    Such statements reaching the database server indicate that an application in front of it is being probed or exploited for SQL injection.
references:
    - https://learn.microsoft.com/en-us/sql/relational-databases/security/auditing/sql-server-audit-action-groups-and-actions
    - https://owasp.org/www-community/attacks/SQL_Injection
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/initial_access_mssql_potential_sql_injection.toml
author: elhoim
date: 2026-11-09
tags:
    - attack.initial-access
    - attack.t1190
logsource:
    product: windows
    service: application
    definition: 'Requirements: a SQL Server Audit writing to the Windows Application log with an audit specification that covers the statements of interest (e.g. SCHEMA_OBJECT_ACCESS_GROUP or BATCH_COMPLETED_GROUP) must be enabled.'
    # warning: The 'data' field used in the detection section is the container for the event data as a whole. You may have to adapt the rule for your backend accordingly
detection:
    selection_provider:
        Provider_Name|contains: 'MSSQL' # Note: We use contains to account for other third party providers - See https://github.com/SigmaHQ/sigma/issues/4876
        EventID: 33205
    selection_payload:
        Data|re|i:
            - 'CONVERT\(INT,\(SELECT (CHAR\(\d{1,3}\)\+){3,}'
            - '(CHAR\(\d{1,3}\)\+){3,}CHAR\(\d{1,3}\)'
            - 'CASE WHEN \(\d+=\d+\).*UNION SELECT \d+'
            - 'UNION SELECT (NULL\s*,\s*){2,}NULL'
            - '''\w*''\s*\+\s*\(\(SELECT @@VERSION\)\)\s*\+\s*''\w*'''
            - '(OR|AND)\s+''?\d+''?\s*=\s*''?\d+''?\s*--'
    condition: all of selection_*
falsepositives:
    - Web application vulnerability scanners run against the application
    - Database administration scripts that build strings with long CHAR() concatenations or enumerate columns with "UNION SELECT NULL"
level: medium
regression_tests_path: regression_data/rules/windows/builtin/application/mssqlserver/win_mssql_potential_sql_injection_patterns/info.yml
