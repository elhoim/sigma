title: Potential Credential Roaming Data Access Via Sensitive LDAP Attribute Read
id: a6cf828f-2470-42bd-88a1-53e3a435714d
status: experimental
description: |
    Detects a read of one of the Active Directory attributes that store Windows Credential Roaming data (ms-PKI-AccountCredentials, ms-PKI-DPAPIMasterKeys, msPKI-CredentialRoamingTokens) as logged by a Directory Service Access event 4662 with the Read Property access mask.
    These attributes hold a user's roamed certificates, private keys and DPAPI master keys.
    An attacker with the rights to read them, for example after abusing a legacy credential-roaming ACL, obtains the material to decrypt the user's protected secrets, a technique attributed to APT29.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/apt29-windows-credential-roaming
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4662
    - https://learn.microsoft.com/en-us/windows/win32/adschema/a-mspkiaccountcredentials
    - https://learn.microsoft.com/en-us/windows/win32/adschema/a-mspkidpapimasterkeys
    - https://learn.microsoft.com/en-us/windows/win32/adschema/a-mspki-credentialroamingtokens
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/credential_access_ldap_attributes.toml
author: elhoim
date: 2026-11-10
tags:
    - attack.credential-access
    - attack.t1552.004
    - attack.t1649
logsource:
    product: windows
    service: security
    definition: 'Requirements: DS Access > Audit Directory Service Access enabled and a SACL on the user objects (or the domain root) auditing Read Property for the credential roaming attributes'
detection:
    selection:
        EventID: 4662
        AccessMask|endswith:
            # AccessMask is a bit field: list every second nibble that carries the Read Property bit (0x10)
            - '1?'
            - '3?'
            - '5?'
            - '7?'
            - '9?'
            - 'B?'
            - 'D?'
            - 'F?'
        Properties|contains:
            - 'b8dfa744-31dc-4ef1-ac7c-84baf7ef9da7' # ms-PKI-AccountCredentials
            - 'b3f93023-9239-4f7c-b99c-6745d87adbc2' # ms-PKI-DPAPIMasterKeys
            - 'b7ff5a38-0818-42b0-8110-d3d154c97f24' # msPKI-CredentialRoamingTokens
    condition: selection
falsepositives:
    - The Credential Roaming client reading the user's own attributes where Credential Roaming is enabled by Group Policy
    - Domain controller processes reading the attributes as SYSTEM (SYSTEM is intentionally not excluded so that an attacker running as SYSTEM on a domain controller is not missed; scope the SACL or filter known accounts)
    - Administrators reviewing another user's credential roaming attributes
level: medium
regression_tests_path: regression_data/rules/windows/builtin/security/win_security_sensitive_ldap_credential_attribute_read/info.yml
