title: Potential Persistence Via Account Password Set To Never Expire
id: 17e3f03b-8943-4e76-82b0-dfd2793e5e1f
related:
    - id: 7864a175-3654-4824-9f0d-f0da18ab27c0
      type: similar
    - id: b9f0e6f5-09b4-4358-bae4-08408705bd5c
      type: similar
status: experimental
description: |
    Detects a user account change in which the "Password Never Expires" flag is enabled: Security event 4738 lists the control flag %%2089 ("Don't Expire Password" - Enabled), or Directory Service Changes event 5136 adds a userAccountControl value that has the DONT_EXPIRE_PASSWORD bit (0x10000) set: 66048 (NORMAL_ACCOUNT | DONT_EXPIRE_PASSWORD) and its common combinations with ACCOUNTDISABLE, PASSWD_NOTREQD, SMARTCARD_REQUIRED, TRUSTED_FOR_DELEGATION, NOT_DELEGATED and USE_DES_KEY_ONLY.
    The list of 5136 values is partial, as Sigma has no bitwise modifier. The 4738 branch covers every combination.
    Attackers set this flag on compromised or newly created accounts so that password rotation never cuts their access. Changes performed by SYSTEM are not excluded as a whole, so that an attacker running as SYSTEM is not missed. Only the exact SAM flag transitions that Windows setup writes for the accounts it creates (0x14 to 0x214 for the first two local accounts of the machine, RID 1000 and 1001, and 0x15 to 0x210 for the Windows 7 "HomeGroupUser$" account) are excluded.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4738
    - https://www.cert.ssi.gouv.fr/uploads/guide-ad.html#dont_expire
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/persistence_dontexpirepasswd_account.toml
author: elhoim
date: 2026-11-10
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: windows
    service: security
    definition: 'Requirements: Audit Policy : Account Management > Audit User Account Management, DS Access > Audit Directory Service Changes'
detection:
    selection_4738:
        EventID: 4738
        UserAccountControl|contains: '%%2089'
    selection_5136:
        EventID: 5136
        AttributeLDAPDisplayName: 'userAccountControl'
        AttributeValue:
            - 66048
            - 66050
            - 66080
            - 66082
            - 328192
            - 590336
            - 1114624
            - 2163200
        OperationType: '%%14674'
    filter_main_setup_local_account:
        # Windows setup (OOBE) creating the first two local accounts of the machine (defaultuser0 and the initial user, RID 1000 and 1001)
        EventID: 4738
        SubjectUserSid: 'S-1-5-18'
        SubjectLogonId: '0x3e7'
        TargetSid|re: '^S-1-5-21-\d+-\d+-\d+-100[01]$'
        OldUacValue: '0x14'
        NewUacValue: '0x214'
    filter_main_setup_homegroup_user:
        # Windows 7 setup creating the built-in HomeGroup account
        EventID: 4738
        SubjectUserSid: 'S-1-5-18'
        SubjectLogonId: '0x3e7'
        TargetUserName: 'HomeGroupUser$'
        OldUacValue: '0x15'
        NewUacValue: '0x210'
    condition: 1 of selection_* and not 1 of filter_main_*
falsepositives:
    - Service accounts that are deliberately configured with a non-expiring password; prefer Group Managed Service Accounts and review the account each time
    - Legitimate account provisioning or management tooling running as SYSTEM
level: medium
regression_tests_path: regression_data/rules/windows/builtin/security/win_security_account_password_set_to_never_expire/info.yml
