title: Potential Credential Roaming Abuse - msPKIAccountCredentials Attribute Modified
id: d5a2d24b-8bd1-450a-9fc8-79d4ccd1cb84
related:
    - id: a6cf828f-2470-42bd-88a1-53e3a435714d
      type: similar
status: experimental
description: |
    Detects a value being added to the "msPKIAccountCredentials" attribute of an Active Directory user object, as logged by a Directory Service Changes event 5136.
    This attribute stores the Windows Credential Roaming blobs (certificates, private keys, DPAPI master keys and credential manager entries). A write to it by an interactive or service account rather than by the credential roaming client itself is unusual; a crafted blob can abuse the roaming feature to write an arbitrary file on the next logon of the victim (CVE-2022-30170), a technique attributed to APT29.
references:
    - https://cloud.google.com/blog/topics/threat-intelligence/apt29-windows-credential-roaming
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-5136
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/privilege_escalation_credroaming_ldap.toml
author: elhoim
date: 2026-11-09
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1068
    - attack.t1098
logsource:
    product: windows
    service: security
    definition: 'Requirements: DS Access > Audit Directory Service Changes enabled and a SACL auditing Write Property on the user objects (the default policy does not cover user objects)'
detection:
    selection:
        EventID: 5136
        AttributeLDAPDisplayName: 'msPKIAccountCredentials'
        OperationType: '%%14674' # Value Added
    condition: selection
falsepositives:
    - Writes made as SYSTEM on a domain controller by management or synchronisation tooling
    - The credential roaming client updates the attribute under the user's own security context at logon and logoff; filter the user writing to their own object if this is noisy in environments where credential roaming is still enabled
level: medium
regression_tests_path: regression_data/rules/windows/builtin/security/win_security_credential_roaming_mspki_account_credentials_modified/info.yml
