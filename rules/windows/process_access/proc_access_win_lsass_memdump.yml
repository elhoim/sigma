title: Potential Credential Dumping Activity Via LSASS
id: 5ef9853e-4d0e-4a70-846f-a9ca37d876da
status: test
description: |
    Detects process access requests to the LSASS process with specific call trace calls and access masks.
    This behaviour is expressed by many credential dumping tools such as Mimikatz, NanoDump, Invoke-Mimikatz, Procdump and even the Taskmgr dumping feature.
references:
    - https://web.archive.org/web/20230329170326/https://blog.menasec.net/2019/02/threat-hunting-21-procdump-or-taskmgr.html
    - https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.001/T1003.001.md
    - https://research.splunk.com/endpoint/e4723b92-7266-11ec-af45-acde48001122/
author: Samir Bousseaden, Michael Haag
date: 2019-04-03
modified: 2026-11-06
tags:
    - attack.credential-access
    - attack.t1003.001
    - attack.s0002
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            - '0x1038'
            - '0x1438'
            - '0x143a'
            - '0x1fffff' # Too many false positives
            # - '0x01000'  # Too many false positives
            # - '0x1010'   # Too many false positives
            # - '0x1400'  # Too many false positives
            # - '0x1410' # Too many false positives
            # - '0x40'   # Too many false positives
        CallTrace|contains:
            - 'dbgcore.dll'
            - 'dbghelp.dll'
            - 'kernel32.dll'
            - 'kernelbase.dll'
            - 'ntdll.dll'
    filter_main_system_user:
        SourceUser|contains: # Covers many language settings
            - 'AUTHORI'
            - 'AUTORI'
        SourceImage|contains:
            - ':\Program Files (x86)\'
            - ':\Program Files\'
            - ':\ProgramData\Microsoft\Windows Defender\Platform\'
            - ':\Windows\System32\'
            - ':\Windows\SysWOW64\'
    filter_optional_tasklist:
        # "tasklist /m" run by an administrator: every frame of the call trace must belong to tasklist.exe or the system ntdll/kernel32/kernelbase/dbghelp.
        # Injected or unknown code (e.g. UNKNOWN(...) frames or other modules) in the trace keeps the event alerting.
        SourceImage: 'C:\Windows\System32\tasklist.exe'
        CallTrace|re|i: '^(?:(?:C:\\Windows\\System32\\(?:ntdll|kernel32|kernelbase|dbghelp)\.dll|C:\\Windows\\System32\\tasklist\.exe)\+[0-9a-f]+(?:\||$))+$'
    filter_optional_mpcmdrun:
        # "MpCmdRun.exe -GetFiles" run by an administrator: every frame of the call trace must belong to MpCmdRun.exe or the system ntdll/kernel32/kernelbase.
        SourceImage: 'C:\Program Files\Windows Defender\MpCmdRun.exe'
        CallTrace|re|i: '^(?:(?:C:\\Windows\\System32\\(?:ntdll|kernel32|kernelbase)\.dll|C:\\Program Files\\Windows Defender\\MpCmdRun\.exe)\+[0-9a-f]+(?:\||$))+$'
    filter_optional_thor:
        CallTrace|contains|all:
            - ':\Windows\Temp\asgard2-agent\'
            - '\thor\thor64.exe+'
            - '|UNKNOWN('
        GrantedAccess: '0x103800'
    filter_optional_sysmon:
        SourceImage|endswith:
            - ':\Windows\Sysmon64.exe'
            - ':\Windows\Sysmon64a.exe'
    condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
    - Administrative tools that enumerate lsass modules with full access
    - Unknown
level: medium
regression_tests_path: regression_data/rules/windows/process_access/proc_access_win_lsass_memdump/info.yml
