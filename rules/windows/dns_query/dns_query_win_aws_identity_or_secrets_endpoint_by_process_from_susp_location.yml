title: Potential AWS Control Plane Access By Process From Suspicious Location
id: 1a8fb17d-8ca0-40ea-9ece-a227416c1e83
status: experimental
description: |
    Detects a DNS query for an AWS identity, secrets or management control plane endpoint (IAM, STS, KMS, Secrets Manager, SSM, SSO, Organizations, Bedrock) issued by a process running from a temporary or user-writable directory.
    Credential stealers and post-exploitation tooling that embed an AWS SDK (boto3, aws-sdk-js, Go SDK) resolve these endpoints directly when they validate or use stolen access keys, without the aws command line binary ever appearing. The query by a binary in ProgramData, Temp or Users\Public is the host-side artefact of that activity.
references:
    - https://thehackernews.com/2024/11/malicious-pypi-package-fabrice-found.html
    - https://unit42.paloaltonetworks.com/teamtnt-operations-cloud-environments/
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/cross-platform/discovery_aws_control_plane_access_by_suspicious_process.toml
author: elhoim
date: 2026-11-10
tags:
    - attack.discovery
    - attack.t1526
    - attack.t1580
logsource:
    category: dns_query
    product: windows
detection:
    selection_domain:
        QueryName|endswith: '.amazonaws.com'
        QueryName|startswith:
            - 'bedrock'
            - 'iam.'
            - 'kms.'
            - 'organizations.'
            - 'portal.sso.'
            - 'secretsmanager.'
            - 'ssm.'
            - 'sso.'
            - 'sts.'
    selection_img:
        Image|contains:
            - ':\ProgramData\'
            - ':\Users\Public\'
            - ':\Windows\Temp\'
            - '\AppData\Local\Temp\'
    filter_main_defender_sense:
        Image|startswith: 'C:\ProgramData\Microsoft\Windows Defender Advanced Threat Protection\'
        Image|endswith: '\MsSense.exe'
    condition: all of selection_* and not 1 of filter_main_*
falsepositives:
    - Build agents and CI runners that compile or download tools into temporary directories and then call AWS APIs during integration tests
    - Portable administration tools run from a user profile or ProgramData
level: medium
regression_tests_path: regression_data/rules/windows/dns_query/dns_query_win_aws_identity_or_secrets_endpoint_by_process_from_susp_location/info.yml
