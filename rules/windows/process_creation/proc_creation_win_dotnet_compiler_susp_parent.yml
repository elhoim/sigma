title: Potential .NET Payload Compilation Via Script Host Or LOLBin
id: 29ffadc0-9585-4895-80de-684dfc5ca252
related:
    - id: b730a276-6b63-41b8-bcf8-55930c8fc6ee
      type: similar
status: experimental
description: |
    Detects the C# or Visual Basic .NET command line compiler ("csc.exe", "vbc.exe") being started by a script host, the WMI command line client, a service host or an execution proxy (wscript, cscript, mshta, wmic, svchost, rundll32, cmstp, regsvr32).
    Malware delivered as script compiles its .NET payload on the victim host to evade file-based detection of pre-built binaries.
    The sibling rule covers csc.exe started by script hosts, Office and PowerShell, this rule adds vbc.exe for all parents and the LOLBin and service parents for both compilers.
references:
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/defense_evasion_dotnet_compiler_parent_process.toml
author: elhoim
date: 2026-11-09
tags:
    - attack.execution
    - attack.stealth
    - attack.t1027.004
    - attack.t1059.005
    - attack.t1059.007
    - attack.t1127
logsource:
    category: process_creation
    product: windows
detection:
    selection_vbc:
        - Image|endswith: '\vbc.exe'
        - OriginalFileName: 'vbc.exe'
    selection_vbc_parent:
        ParentImage|endswith:
            - '\cmstp.exe'
            - '\cscript.exe'
            - '\mshta.exe'
            - '\regsvr32.exe'
            - '\rundll32.exe'
            - '\svchost.exe'
            - '\wmic.exe'
            - '\wscript.exe'
    selection_csc:
        - Image|endswith: '\csc.exe'
        - OriginalFileName: 'csc.exe'
    selection_csc_parent:
        # Script host parents of csc.exe are covered by the sibling rule
        ParentImage|endswith:
            - '\cmstp.exe'
            - '\regsvr32.exe'
            - '\rundll32.exe'
            - '\svchost.exe'
            - '\wmic.exe'
    condition: (selection_vbc and selection_vbc_parent) or (selection_csc and selection_csc_parent)
falsepositives:
    - Scheduled tasks or services that start csc.exe or vbc.exe directly, such as build or deployment jobs
    - WMI event consumers compiling helper assemblies
level: medium
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_dotnet_compiler_susp_parent/info.yml
