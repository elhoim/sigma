title: HackTool - ReGeorg, Neo-reGeorg Or Suo5 Client Execution - Windows
id: 4ec7fab8-7c9c-45a6-8d8a-7b9fdddd30b9
status: experimental
description: |
    Detects the execution of the client side of the reGeorg, Neo-reGeorg and suo5 HTTP tunnelling tools.
    The client ("reGeorgSocksProxy.py -u", "neoreg.py -k <key> -u <url>", "suo5 -t <url>") opens a local SOCKS proxy and relays the traffic over HTTP to a tunnel web shell previously dropped on a compromised web server.
    "neoreg.py generate -k <key>" is also matched, as it builds the server-side web shells.
references:
    - https://github.com/LOTTunnels/LOTTunnels.github.io/blob/d6fc42602ff543595b49b6f735f1e353be66bc35/_lottunnels/Binaries/neo-regeorg.md
    - https://github.com/LOTTunnels/LOTTunnels.github.io/blob/d6fc42602ff543595b49b6f735f1e353be66bc35/_lottunnels/Binaries/regeorg.md
    - https://github.com/LOTTunnels/LOTTunnels.github.io/blob/d6fc42602ff543595b49b6f735f1e353be66bc35/_lottunnels/Binaries/suo5.md
author: elhoim
date: 2026-11-13
tags:
    - attack.command-and-control
    - attack.t1090
    - attack.t1572
logsource:
    category: process_creation
    product: windows
detection:
    selection_python:
        Image|endswith:
            - '\python.exe'
            - '\python3.exe'
            - '\pythonw.exe'
    selection_cli_neoreg:
        CommandLine|contains|all:
            - 'neoreg.py'
            - ' -k '
    selection_cli_regeorg:
        CommandLine|contains|all:
            - 'reGeorgSocksProxy.py'
            - ' -u '
    selection_suo5:
        Image|contains: '\suo5'
        Image|endswith: '.exe'
        CommandLine|contains:
            - ' -t http'
            - ' --target http'
    condition: (selection_python and 1 of selection_cli_*) or selection_suo5
falsepositives:
    - Authorized use of the tools during a security assessment
level: high
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_hktl_regeorg_neoreg_suo5_client/info.yml
