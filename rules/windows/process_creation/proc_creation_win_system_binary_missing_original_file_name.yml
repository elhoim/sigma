title: Potential Tampered System Binary - Version Resource Missing From Known Windows Executable
id: 5f1b8512-8083-45b3-a668-cedf199a8748
status: experimental
description: |
    Detects the execution of an image named like a well-known Windows system executable (cmd, powershell, pwsh, rundll32, regsvr32, mshta, certutil, wmic, msbuild, wscript, cscript, cmstp, msiexec, regasm, regsvcs, installutil) while Sysmon reports its OriginalFileName as "-", which means the binary has no version resource or no OriginalFilename entry.
    Every genuine build of these Microsoft binaries carries an OriginalFilename.
    A copy whose version resource was stripped or rewritten defeats OriginalFileName-based detections and breaks the Authenticode signature; dropping a tool under a system binary name without version information is a masquerading indicator.
references:
    - https://adversarial-detection-engineering.github.io/ofndb/gotchas/
    - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
author: elhoim
date: 2026-11-09
tags:
    - attack.stealth
    - attack.t1027.005
    - attack.t1036
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\rundll32.exe'
            - '\regsvr32.exe'
            - '\mshta.exe'
            - '\certutil.exe'
            - '\wmic.exe'
            - '\msbuild.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\cmstp.exe'
            - '\msiexec.exe'
            - '\regasm.exe'
            - '\regsvcs.exe'
            - '\installutil.exe'
        OriginalFileName: '-'
    condition: selection
falsepositives:
    - Sysmon logs "-" when it cannot read the version resource of a short-lived or already deleted image; check the Hashes and the Image path of the event
level: medium
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_system_binary_missing_original_file_name/info.yml
