title: Potential Supply Chain Compromise Via Rust Build Toolchain Spawning Interpreter Or Downloader
id: e98a65c0-9b7c-49a5-a8dc-c2528457d8d6
status: experimental
description: |
    Detects the Rust build tools "cargo.exe", "rustc.exe" or a compiled Cargo build script ("build-script-build.exe") spawning a command shell, a script interpreter or a download utility.
    Cargo build scripts (build.rs) and procedural macros run arbitrary code at compile time; a malicious or typosquatted crate uses them to run PowerShell or cmd, or to fetch a second stage with curl or wget, on every developer or CI host that builds the project.
references:
    - https://slapopotamus.github.io/HuntPack/hunts/Arrayref-RustCrate-SupplyChain-Hunt.html
    - https://github.com/ByteRay-Labs/Query-Hub/blob/a453fcb09118894840a4e00b0db0f9807ba8441d/queries/Rust_Build_Toolchain_Spawning_Interpreter_or_Downloader.yml
    - https://github.com/rust-lang/cargo/blob/5c18b2672ae2f81c7ca02542e90fca492b7036a8/src/compiler/layout.rs
author: elhoim
date: 2026-11-10
tags:
    - attack.execution
    - attack.initial-access
    - attack.t1059
    - attack.t1195.002
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\cargo.exe'
            - '\rustc.exe'
            - '\build-script-build.exe'
    selection_child:
        - Image|endswith:
              - '\powershell.exe'
              - '\pwsh.exe'
              - '\cmd.exe'
              - '\wscript.exe'
              - '\cscript.exe'
              - '\mshta.exe'
              - '\curl.exe'
              - '\wget.exe'
              - '\certutil.exe'
              - '\bitsadmin.exe'
              - '\bash.exe'
              - '\sh.exe'
        - OriginalFileName:
              - 'PowerShell.EXE'
              - 'pwsh.dll'
              - 'Cmd.Exe'
              - 'wscript.exe'
              - 'cscript.exe'
              - 'MSHTA.EXE'
              - 'curl.exe'
              - 'CertUtil.exe'
              - 'bitsadmin.exe'
    condition: all of selection_*
falsepositives:
    - Legitimate build scripts that invoke a shell or download build dependencies (vendoring scripts, CI wrappers, bindgen or cmake helpers); baseline approved build hosts and exclude reviewed command lines
level: medium
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_rust_build_toolchain_susp_child_process/info.yml
