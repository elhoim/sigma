title: Suspicious Deletion Of Defender Support Or RDP Log Files Via Command Line
id: 24fdf8c5-1afd-427a-9a1f-aee3b8539319
related:
    - id: 0a1f9d29-6465-4776-b091-7f43b26e4c89
      type: similar
status: experimental
description: |
    Detects a command line that deletes the Microsoft Defender support log folder (ProgramData\Microsoft\Windows Defender\Support) or the Remote Desktop Services log folders (System32\LogFiles\RDP*) with "del", "erase", "rd", "rmdir", "rm" or "Remove-Item".
    These folders hold the Defender operational logs (MPLog, MPDetection) and the RDP session logs that document which hosts were connected to. The Gentlemen ransomware wipes them together with Prefetch and the Recycle Bin right before encryption to hinder forensic reconstruction.
references:
    - https://securelist.com/the-gentlemen-raas/120447/
    - https://github.com/ByteRay-Labs/Query-Hub/blob/a453fcb09118894840a4e00b0db0f9807ba8441d/queries/the_gentlemen_raas_custom_backdoors_and_evolving_tactics.yml
author: elhoim
date: 2026-11-09
tags:
    - attack.stealth
    - attack.t1070.004
logsource:
    product: windows
    category: process_creation
detection:
    selection_target:
        CommandLine|contains:
            - '\Microsoft\Windows Defender\Support\'
            - '\System32\LogFiles\RDP'
    selection_delete:
        CommandLine|contains:
            - 'del '
            - 'erase '
            - 'rd '
            - 'rmdir '
            - 'rm '
            - 'Remove-Item'
            - ' -ri '
    condition: all of selection_*
falsepositives:
    - Administrators cleaning up Defender support logs or RDP log folders manually; disk clean-up scripts
level: high
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_susp_defender_support_rdp_log_deletion/info.yml
