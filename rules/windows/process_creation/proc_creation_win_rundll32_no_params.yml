title: Rundll32 Execution Without CommandLine Parameters
id: 1775e15e-b61b-4d14-a1a3-80981298085a
status: test
description: Detects suspicious start of rundll32.exe without any parameters as found in CobaltStrike beacon activity
references:
    - https://www.cobaltstrike.com/help-opsec
    - https://twitter.com/ber_m1ng/status/1397948048135778309
author: Florian Roth (Nextron Systems)
date: 2021-05-27
modified: 2026-11-05
tags:
    - attack.stealth
    - attack.t1202
logsource:
    category: process_creation
    product: windows
detection:
    selection_cli:
        CommandLine|endswith:
            - '\rundll32.exe'
            - '\rundll32.exe"'
            - '\rundll32'
    selection_cli_trailing_space:
        # Command lines built by cmd.exe or Start-Process carry one or more trailing spaces
        CommandLine|re|i: '\\rundll32(?:\.exe)?"?\s+$'
    filter_optional_edge:
        ParentImage|contains:
            - ':\Program Files (x86)\Microsoft\Edge\'
            - ':\Program Files (x86)\Microsoft\EdgeUpdate\'
            - ':\Program Files\Microsoft\Edge\'
            - ':\Program Files\Microsoft\EdgeUpdate\'
    condition: 1 of selection_* and not 1 of filter_optional_*
falsepositives:
    - Possible but rare
level: high
