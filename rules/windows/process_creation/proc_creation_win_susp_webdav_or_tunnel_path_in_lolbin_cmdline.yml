title: Suspicious WebDAV Or Tunnel Path In Script Interpreter Or LOLBin Command Line
id: 847eb2fa-a6a8-4eeb-aa7f-fb61ae83598c
related:
    - id: f8de9dd5-7a63-4cfd-9d0c-ae124878b5a9
      type: similar
status: experimental
description: |
    Detects command and script interpreters or download-capable system utilities whose command line references a WebDAV share ("\DavWWWRoot\", "\webdav\", "@SSL\", UNC path with an "@port" suffix) or a free Cloudflare tunnel host ("trycloudflare.com").
    Phishing campaigns deliver shortcuts and scripts that make cmd.exe, PowerShell, mshta.exe or msiexec.exe fetch and run the next stage directly from an attacker WebDAV server, often exposed through a Cloudflare quick tunnel, so that nothing is written to disk before execution.
    The related threat-hunting rule only looks at processes whose own image path is on a WebDAV share; this rule inspects the arguments of the launching utility.
references:
    - https://www.proofpoint.com/us/blog/threat-insight/threat-actor-abuses-cloudflare-tunnels-deliver-rats
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/execution_scripting_remote_webdav.toml
author: elhoim
date: 2026-11-10
tags:
    - attack.command-and-control
    - attack.execution
    - attack.t1105
    - attack.t1204.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith:
              - '\bitsadmin.exe'
              - '\cmd.exe'
              - '\conhost.exe'
              - '\curl.exe'
              - '\mshta.exe'
              - '\msiexec.exe'
              - '\net.exe'
              - '\net1.exe'
              - '\powershell.exe'
              - '\pwsh.exe'
              - '\wscript.exe'
              - '\cscript.exe'
        - OriginalFileName:
              - 'bitsadmin.exe'
              - 'Cmd.Exe'
              - 'CONHOST.EXE'
              - 'curl.exe'
              - 'MSHTA.EXE'
              - 'msiexec.exe'
              - 'net.exe'
              - 'net1.exe'
              - 'PowerShell.EXE'
              - 'pwsh.dll'
              - 'wscript.exe'
              - 'cscript.exe'
    selection_cli:
        CommandLine|contains:
            - 'trycloudflare.com'
            - '@SSL\'
            - '\webdav\'
            - '\DavWWWRoot\'
            - '@80\'
            - '@443\'
            - '@8080\'
            - '@8443\'
    filter_main_sharepoint:
        Image|endswith:
            - '\cmd.exe'
            - '\net.exe'
            - '\net1.exe'
        CommandLine|re: '^(?:"[A-Za-z]:\\[^"&|<>^()%!]*\\(?:net1?|cmd)\.exe"|(?:net1?|cmd)(?:\.exe)?)\s+(?:/c\s+(?:net1?\s+)?)?use\s+(?:/persistent:(?:yes|no)\s+)?(?:[A-Za-z]:\s+)?\\\\[A-Za-z0-9-]+\.sharepoint\.com@SSL\\DavWWWRoot\\[^\s@&|<>^()%!"]*\s*$'
    condition: all of selection_* and not 1 of filter_main_*
falsepositives:
    - Scripts that map or browse internal WebDAV shares (document management systems, Nextcloud/ownCloud, IIS WebDAV) by UNC path
    - Developers exposing local services through Cloudflare quick tunnels and testing them with curl
level: high
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_susp_webdav_or_tunnel_path_in_lolbin_cmdline/info.yml
