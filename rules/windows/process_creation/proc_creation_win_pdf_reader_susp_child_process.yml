title: Suspicious PDF Reader Child Process
id: 921821d6-aedf-488e-af00-f0039878738c
related:
    - id: 438025f9-5856-4663-83f7-52f878a70a50
      type: similar
status: experimental
description: |
    Detects Adobe Acrobat Reader, Adobe Acrobat or Foxit PDF readers spawning a command shell, a script host, a LOLBin or a native discovery utility.
    PDF readers only start their own helper processes and the system browser; a child such as cmd.exe, powershell.exe, mshta.exe, regsvr32.exe, certutil.exe, whoami.exe or nltest.exe indicates a document exploit or a social engineering lure (embedded JavaScript, launch action) executing code from the reader.
references:
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules/windows/execution_suspicious_pdf_reader.toml
author: elhoim
date: 2026-11-11
tags:
    - attack.execution
    - attack.initial-access
    - attack.discovery
    - attack.stealth
    - attack.t1203
    - attack.t1204.002
    - attack.t1566.001
    - attack.t1218
    - attack.t1082
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\AcroRd32.exe'
            - '\Acrobat.exe'
            - '\FoxitPhantomPDF.exe'
            - '\FoxitReader.exe'
            - '\FoxitPDFReader.exe'
            - '\FoxitPDFEditor.exe'
    selection_child:
        Image|endswith:
            - '\arp.exe'
            - '\atbroker.exe'
            - '\bginfo.exe'
            - '\bitsadmin.exe'
            - '\cdb.exe'
            - '\certutil.exe'
            - '\cmd.exe'
            - '\cmstp.exe'
            - '\cscript.exe'
            - '\csi.exe'
            - '\dnx.exe'
            - '\dsget.exe'
            - '\dsquery.exe'
            - '\forfiles.exe'
            - '\fsi.exe'
            - '\ftp.exe'
            - '\gpresult.exe'
            - '\hostname.exe'
            - '\ieexec.exe'
            - '\iexpress.exe'
            - '\installutil.exe'
            - '\ipconfig.exe'
            - '\Microsoft.Workflow.Compiler.exe'
            - '\msbuild.exe'
            - '\mshta.exe'
            - '\msxsl.exe'
            - '\nbtstat.exe'
            - '\net.exe'
            - '\net1.exe'
            - '\netsh.exe'
            - '\netstat.exe'
            - '\nltest.exe'
            - '\odbcconf.exe'
            - '\ping.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\qprocess.exe'
            - '\quser.exe'
            - '\qwinsta.exe'
            - '\rcsi.exe'
            - '\reg.exe'
            - '\regasm.exe'
            - '\regsvcs.exe'
            - '\regsvr32.exe'
            - '\sc.exe'
            - '\schtasks.exe'
            - '\systeminfo.exe'
            - '\tasklist.exe'
            - '\tracert.exe'
            - '\whoami.exe'
            - '\wmic.exe'
            - '\wscript.exe'
            - '\xwizard.exe'
    condition: all of selection_*
falsepositives:
    - Unknown
level: high
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_pdf_reader_susp_child_process/info.yml
