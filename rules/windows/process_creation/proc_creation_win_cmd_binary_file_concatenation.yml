title: Binary File Concatenation Via Cmd.EXE
id: 495c6dcf-712e-4182-907d-10410a8abf72
related:
    - id: 7039a6d7-ca54-41b5-8783-14f215135ae0
      type: similar
status: experimental
description: |
    Detects the Windows command shell being used to reassemble a file from several pieces, either with "copy /b <part1>+<part2> <target>" (binary concatenation) or with "type <part> >> <target>" (append redirection).
    Loaders split a payload into chunks, or hide it behind a benign file (image, document), and glue the pieces back together on the host so that no single file on disk or in transit resembles the final executable. Administrators rarely concatenate files from cmd.exe.
references:
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/copy
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/type
author: elhoim
date: 2026-11-10
tags:
    - attack.stealth
    - attack.t1027.009
    - attack.t1140
logsource:
    product: windows
    category: process_creation
detection:
    selection_img:
        - Image|endswith: '\cmd.exe'
        - OriginalFileName: 'Cmd.Exe'
    selection_cli_copy:
        CommandLine|contains|all:
            - 'copy '
            - '/b'
            - '+'
    selection_cli_type:
        CommandLine|contains|all:
            - 'type '
            - '>>'
    condition: selection_img and 1 of selection_cli_*
falsepositives:
    - Build, packaging and backup scripts that merge split files or append logs with cmd.exe redirection
    - Software deployment tools that rebuild installers from chunked downloads
level: low
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_cmd_binary_file_concatenation/info.yml
