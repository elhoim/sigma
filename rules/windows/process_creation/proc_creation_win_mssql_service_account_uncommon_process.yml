title: Potential SQL Server Abuse - Uncommon Process Running Under MSSQL Service Account
id: 724cdea4-f348-4adf-a40b-18a4209d9c5f
related:
    - id: 869b9ca7-9ea2-4a5a-8325-e80e62f75445
      type: similar
status: experimental
description: |
    Detects a process started under one of the SQL Server virtual service accounts (NT SERVICE\MSSQLSERVER, MSSQL$<instance>, SQLSERVERAGENT, SQLAGENT$<instance>, ReportServer, MsDtsServer, MSSQLFDLauncher, SQLWriter...) that is not a binary under the Microsoft SQL Server install folder or an expected Windows error-reporting helper.
    Processes running as these accounts are normally the SQL Server engine, agent and tooling; any other image (cmd, PowerShell, certutil, a dropped binary) means commands are being executed through the database (xp_cmdshell, SQL Agent jobs, CLR assemblies, OLE automation) after a SQL injection, weak sa password or compromised linked server, regardless of which SQL process is the direct parent.
references:
    - https://learn.microsoft.com/en-us/sql/database-engine/configure-windows/configure-windows-service-accounts-and-permissions
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules_building_block/lateral_movement_unusual_process_sql_accounts.toml
author: elhoim
date: 2026-11-11
tags:
    - attack.execution
    - attack.initial-access
    - attack.persistence
    - attack.t1059
    - attack.t1190
    - attack.t1505.001
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        User|contains:
            - 'NT SERVICE\MSSQL'
            - 'NT SERVICE\SQLSERVERAGENT'
            - 'NT SERVICE\SQLAGENT$'
            - 'NT SERVICE\ReportServer'
            - 'NT SERVICE\MsDtsServer'
            - 'NT SERVICE\SQLWriter'
    filter_main_sql_install_paths:
        Image|startswith:
            - 'C:\Program Files\Microsoft SQL Server\'
            - 'C:\Program Files (x86)\Microsoft SQL Server\'
    filter_main_windows_helpers:
        Image:
            - 'C:\Windows\System32\wermgr.exe'
            - 'C:\Windows\System32\conhost.exe'
            - 'C:\Windows\System32\WerFault.exe'
            - 'C:\Windows\SysWOW64\WerFault.exe'
    filter_main_sqlservr_cmd:
        # covered by the related "Suspicious Child Process Of SQL Server" rule
        ParentImage|re: '(?i)^C:\\Program Files( \(x86\))?\\Microsoft SQL Server\\[^"]+\\Binn\\sqlservr\.exe$'
        Image: 'C:\Windows\System32\cmd.exe'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - SQL Agent job steps that legitimately run PowerShell or CmdExec tasks, and third-party backup agents started by the SQL service account; exclude them by full image path. SQL Server components are excluded by install path only, not by file name, because a binary named sqlservr.exe dropped elsewhere would otherwise hide
level: medium
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_mssql_service_account_uncommon_process/info.yml
