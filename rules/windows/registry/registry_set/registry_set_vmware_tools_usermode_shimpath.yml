title: Potential Persistence Via VMware Tools Usermode ShimPath Registry Value
id: 67bfbde5-12b8-4a5a-91ac-9631f4b7a51b
status: experimental
description: |
    Detects the creation of the "AdapterShimPath" or "ShimPath" value under the "VMware, Inc.\VMware Tools\Usermode" registry key.
    The user mode part of the VMware SVGA 3D display driver ("vm3dum.dll" and its variants), which is loaded into every process that uses Direct3D inside a VMware guest, reads the "AdapterShimPath" value and loads the library it points to. The driver also reads "ShimPath", under conditions that are not documented.
    The values are not present on a default VMware Tools installation. Setting one of them injects an attacker's DLL into graphical processes such as browsers each time they start.
references:
    - https://www.hexacorn.com/blog/2018/03/26/beyond-good-ol-run-key-part-74/
author: elhoim
date: 2026-11-12
tags:
    - attack.execution
    - attack.persistence
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1574
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|endswith:
            - '\VMware, Inc.\VMware Tools\Usermode\AdapterShimPath'
            - '\VMware, Inc.\VMware Tools\Usermode\ShimPath'
    filter_main_empty:
        - Details: null
        - Details: ''
        - Details: '(Empty)'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - VMware support or graphics driver developers who load a diagnostic shim
level: medium
regression_tests_path: regression_data/rules/windows/registry/registry_set/registry_set_vmware_tools_usermode_shimpath/info.yml
