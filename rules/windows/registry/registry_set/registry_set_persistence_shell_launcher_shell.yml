title: Potential Persistence Via Shell Launcher Registry Configuration
id: 55d95621-4518-47c6-8da9-4f56abf629a4
status: experimental
description: |
    Detects the modification of the custom shell configured for the Shell Launcher feature, either the Windows Server variant read by "servercoreshell.exe" ("SOFTWARE\Microsoft\ServerCore\Shell Launcher") or the client and embedded variant ("SOFTWARE\Microsoft\Windows Embedded\Shell Launcher"), by a process other than the Windows servicing stack.
    The "Shell" value, global or per user SID or user name, names the program that is started as the shell of the session instead of, or before, the default one.
    An attacker with sufficient rights can replace it to have a program started at each logon of the targeted users. Outside of kiosk and Server Core deployments these values are not expected to change.
references:
    - https://www.hexacorn.com/blog/2025/08/17/beyond-good-ol-run-key-part-150/
    - https://learn.microsoft.com/en-us/windows/configuration/shell-launcher/
author: elhoim
date: 2026-11-12
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1547
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains:
            - '\SOFTWARE\Microsoft\ServerCore\Shell Launcher\'
            - '\SOFTWARE\Microsoft\Windows Embedded\Shell Launcher\'
        TargetObject|endswith: '\Shell'
    filter_main_empty:
        Details: '(Empty)'
    filter_main_servicing_trustedinstaller:
        Image: 'C:\Windows\servicing\TrustedInstaller.exe'
    filter_main_servicing_tiworker:
        Image|startswith: 'C:\Windows\WinSxS\'
        Image|endswith: '\TiWorker.exe'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Administrators or device management agents that configure a kiosk shell with Shell Launcher
level: medium
regression_tests_path: regression_data/rules/windows/registry/registry_set/registry_set_persistence_shell_launcher_shell/info.yml
