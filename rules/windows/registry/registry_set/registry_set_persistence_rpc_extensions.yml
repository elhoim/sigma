title: Potential Persistence Via RPC Extensions Registry Key
id: 8b471539-4995-41e2-af36-a71ba35c2022
status: experimental
description: |
    Detects the creation or modification of a value under the "Rpc\Extensions" registry key.
    Starting with Windows 7, the RPC runtime (rpcrt4.dll and RpcEpMap.dll) reads this key and loads the extension DLLs it names into the processes that use RPC.
    The default values are only written by the operating system, so that a write could be an attempt to get a DLL loaded by a large number of processes.
references:
    - https://www.hexacorn.com/blog/2015/09/12/beyond-good-ol-run-key-part-32/
author: elhoim
date: 2026-11-12
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1546
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\SOFTWARE\Microsoft\Rpc\Extensions\'
    filter_main_servicing_poqexec:
        Image: 'C:\Windows\System32\poqexec.exe'
    filter_main_servicing_tiworker:
        Image|startswith: 'C:\Windows\WinSxS\'
        Image|endswith: '\TiWorker.exe'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Unknown
level: medium
regression_tests_path: regression_data/rules/windows/registry/registry_set/registry_set_persistence_rpc_extensions/info.yml
