title: Potential Service Tampering - Start Type Set To Manual Or Disabled Via Direct Registry Write
id: 6300bb2e-056e-4efb-86f8-42ca310e8ece
related:
    - id: e1aa95de-610a-427d-b9e7-9b46cfafbe6a
      type: similar
status: experimental
description: |
    Detects a service's "Start" registry value being set to 3 (Manual) or 4 (Disabled) by a process other than the Service Control Manager ("services.exe"), servicing components, or an application installed under Program Files.
    sc.exe, Set-Service and installers change the start type through the SCM, so the writer is services.exe; a direct write by reg.exe, PowerShell or a dropped binary is how malware and ransomware disable security, backup and recovery services (or make them manual) without producing the SCM configuration change event.
references:
    - https://learn.microsoft.com/en-us/windows/win32/services/service-configuration
    - https://github.com/elastic/detection-rules/blob/f4ef34b1c996da53880053dd497ca546c1b0bbfa/rules_building_block/defense_evasion_service_disabled_registry.toml
author: elhoim
date: 2026-11-11
tags:
    - attack.defense-impairment
    - attack.impact
    - attack.persistence
    - attack.t1112
    - attack.t1489
    - attack.t1685
logsource:
    product: windows
    category: registry_set
detection:
    selection:
        TargetObject|contains: '\Services\'
        TargetObject|endswith: '\Start'
        Details:
            - 'DWORD (0x00000003)'
            - 'DWORD (0x00000004)'
    filter_main_scm:
        Image: 'C:\Windows\System32\services.exe'
    filter_main_program_files:
        Image|startswith:
            - 'C:\Program Files\'
            - 'C:\Program Files (x86)\'
    filter_main_servicing:
        Image|startswith:
            - 'C:\Windows\WinSxS\'
            - 'C:\Windows\servicing\'
    filter_main_system_components:
        Image:
            - 'C:\Windows\System32\drvinst.exe'
            - 'C:\Windows\System32\poqexec.exe'
            - 'C:\Windows\System32\msiexec.exe'
            - 'C:\Windows\SysWOW64\msiexec.exe'
            - 'C:\Windows\System32\dism.exe'
    filter_main_mrxsmb10:
        TargetObject|re: '(?i)^HKLM\\System\\(CurrentControlSet|ControlSet00[0-9])\\Services\\MrxSmb10\\Start$'
    filter_optional_gpo_client:
        Image: 'C:\Windows\System32\svchost.exe'
        User|contains:
            - 'AUTHORI'
            - 'AUTORI'
    condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
    - Group Policy preference service changes written by svchost.exe under an account other than SYSTEM, and writes by WmiPrvSE.exe or wsmprovhost.exe (remote WMI or WinRM management), which are not excluded because an attacker can use the same channels
    - Hardening or debloating scripts that disable services through the registry; configuration management tools writing service start types directly
level: medium
regression_tests_path: regression_data/rules/windows/registry/registry_set/registry_set_service_start_type_disabled_by_uncommon_process/info.yml
