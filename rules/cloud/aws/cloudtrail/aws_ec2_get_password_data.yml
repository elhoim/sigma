title: AWS EC2 Windows Administrator Password Data Requested
id: ae56ccd8-94b9-46ea-9f09-6d2170bb65eb
status: experimental
description: |
    Detects a request for the encrypted administrator password of a Windows EC2 instance.
    Adversaries holding the private key of the instance key pair may retrieve the password to log in to the instance.
references:
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_GetPasswordData.html
    - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/49dae1447e92cf1a65390b52f95fed6c15f41d2f/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ec2-ebs-ssm-and-vpc-post-exploitation/README.md
    - https://github.com/sbasu7241/AWS-Threat-Simulation-and-Detection/blob/f7762e91c4a5e8b42b61b87a2b145c0cab8ac6b6/aws.credential-access.ec2-get-password-data.md
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1552
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'ec2.amazonaws.com'
        eventName: 'GetPasswordData'
    condition: selection
falsepositives:
    - Administrators retrieving the initial password of newly launched Windows instances
level: low
