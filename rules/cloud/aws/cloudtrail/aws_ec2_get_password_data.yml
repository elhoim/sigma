title: AWS EC2 Windows Administrator Password Data Requested
id: ae56ccd8-94b9-46ea-9f09-6d2170bb65eb
status: experimental
description: |
    Detects a request for the encrypted administrator password of a Windows EC2 instance.
    Adversaries holding the private key of the instance key pair may retrieve the password to log in to the instance.
references:
    - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_GetPasswordData.html
    - https://docs.datadoghq.com/security/default_rules/otd-at8-rcy/
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1552
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'ec2.amazonaws.com'
        eventName: 'GetPasswordData'
    condition: selection
falsepositives:
    - Administrators retrieving the initial password of newly launched Windows instances
level: low
