title: AWS IAM Compromised Key Quarantine Policy Attached
id: b3cb1097-f3bc-4610-9afd-f6814a70fe29
status: experimental
description: |
    Detects the attachment of the AWS managed "AWSCompromisedKeyQuarantine" policy (any version) to an IAM principal.
    AWS attaches this policy automatically when it finds an access key of the principal publicly exposed (e.g. committed to a public code repository).
    The key should be considered compromised and any activity performed with it should be reviewed.
references:
    - https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSCompromisedKeyQuarantineV3.html
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_AttachUserPolicy.html
author: elhoim
date: 2026-10-15
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1078.004
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'iam.amazonaws.com'
        eventName:
            - 'AttachGroupPolicy'
            - 'AttachRolePolicy'
            - 'AttachUserPolicy'
        requestParameters.policyArn|contains: 'AWSCompromisedKeyQuarantine'
    condition: selection
falsepositives:
    - Unlikely, as this policy is applied by AWS when a leaked credential is detected
level: high
