title: AWS Secrets Manager Secret Retrieved From CloudShell
id: d516d919-5173-478c-b5c8-acae39fa1544
status: experimental
description: |
    Detects a Secrets Manager secret value being retrieved from an AWS CloudShell environment.
    Adversaries with console access may use CloudShell to retrieve secrets without needing local credentials or tooling.
references:
    - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
    - https://docs.aws.amazon.com/cloudshell/latest/userguide/welcome.html
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1555.006
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'secretsmanager.amazonaws.com'
        eventName: 'GetSecretValue'
        userAgent|contains: 'exec-env/CloudShell'
    condition: selection
falsepositives:
    - Administrators legitimately retrieving secrets from CloudShell
level: medium
