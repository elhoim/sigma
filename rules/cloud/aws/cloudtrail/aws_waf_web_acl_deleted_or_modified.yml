title: AWS WAF Web ACL Deleted Or Modified
id: 63bdccc5-74ce-43ef-abcb-1f26ae79bcd5
status: experimental
description: |
    Detects an AWS WAF web ACL being deleted or updated.
    Adversaries may remove or weaken web ACL rules to expose protected applications to attacks or to stop blocking their traffic.
references:
    - https://docs.aws.amazon.com/waf/latest/APIReference/API_DeleteWebACL.html
    - https://docs.aws.amazon.com/waf/latest/APIReference/API_UpdateWebACL.html
    - https://docs.datadoghq.com/security/default_rules/rkm-8xh-x8b/
author: elhoim
date: 2026-10-15
tags:
    - attack.defense-impairment
    - attack.t1686.001
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource:
            - 'waf-regional.amazonaws.com'
            - 'waf.amazonaws.com'
            - 'wafv2.amazonaws.com'
        eventName:
            - 'DeleteWebACL'
            - 'UpdateWebACL'
    condition: selection
falsepositives:
    - Legitimate maintenance of web ACLs by administrators or infrastructure-as-code pipelines
level: low
