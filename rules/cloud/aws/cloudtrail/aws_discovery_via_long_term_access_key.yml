title: AWS Backup, Resource Explorer Or SES Discovery Via Long-Term Access Key
id: b87e61a5-413b-4331-ad6b-3c0a3d47852f
status: experimental
description: |
    Detects enumeration of AWS Backup, AWS Resource Explorer or Amazon SES using long-term IAM user access keys (AKIA).
    Adversaries using leaked access keys commonly query these services to inventory resources and backups or to assess whether the account can be abused for sending email.
references:
    - https://docs.aws.amazon.com/aws-backup/latest/devguide/API_ListBackupVaults.html
    - https://docs.aws.amazon.com/resource-explorer/latest/apireference/API_Search.html
    - https://docs.aws.amazon.com/ses/latest/APIReference/API_GetSendQuota.html
author: elhoim
date: 2026-10-15
tags:
    - attack.discovery
    - attack.t1526
    - attack.t1580
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_key:
        userIdentity.accessKeyId|startswith: 'AKIA'
    selection_svc_backup:
        eventSource: 'backup.amazonaws.com'
        eventName:
            - 'ListBackupPlans'
            - 'ListBackupVaults'
            - 'ListProtectedResources'
    selection_svc_resource_explorer:
        eventSource: 'resource-explorer-2.amazonaws.com'
        eventName:
            - 'CreateIndex'
            - 'ListResources'
            - 'Search'
    selection_svc_ses:
        eventSource: 'ses.amazonaws.com'
        eventName:
            - 'GetAccount'
            - 'GetAccountSendingEnabled'
            - 'GetSendQuota'
    condition: selection_key and 1 of selection_svc_*
falsepositives:
    - Administrators or scripts using IAM user access keys to manage these services
level: low
