title: AWS S3 Buckets Listed Via EC2 Instance Credentials
id: eb59bcf5-c627-42da-a8dc-a05bb7c6c1a6
status: experimental
description: |
    Detects the listing of all S3 buckets using the temporary credentials of an EC2 instance profile.
    Adversaries who steal instance credentials from the metadata service commonly start by enumerating the S3 buckets of the account.
references:
    - https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListBuckets.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html
    - https://docs.datadoghq.com/security/default_rules/8b7-d38-74d/
author: elhoim
date: 2026-10-15
tags:
    - attack.discovery
    - attack.t1619
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 's3.amazonaws.com'
        eventName: 'ListBuckets'
        userIdentity.type: 'AssumedRole'
        userIdentity.arn|re: ':assumed-role/[^/]+/i-[0-9a-f]{8,17}$'
    condition: selection
falsepositives:
    - Applications or agents running on EC2 instances that legitimately list buckets
level: low
