title: AWS IAM Identity Modification Via EC2 Instance Credentials
id: f421a7e0-d92e-4275-9ac4-53325197e142
status: experimental
description: |
    Detects IAM users, access keys, login profiles or policy attachments being created or modified using the temporary credentials of an EC2 instance profile.
    The session name of instance profile credentials is the instance ID. Workloads rarely manage IAM identities, so such activity can indicate that credentials stolen from the instance metadata service are used for persistence or privilege escalation.
references:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'iam.amazonaws.com'
        eventName:
            - 'AddUserToGroup'
            - 'AttachRolePolicy'
            - 'AttachUserPolicy'
            - 'CreateAccessKey'
            - 'CreateLoginProfile'
            - 'CreateUser'
            - 'PutRolePolicy'
            - 'PutUserPolicy'
            - 'UpdateAssumeRolePolicy'
            - 'UpdateLoginProfile'
        userIdentity.type: 'AssumedRole'
        userIdentity.arn|re: ':assumed-role/[^/]+/i-[0-9a-f]{8,17}$'
    condition: selection
falsepositives:
    - EC2 instances that legitimately manage IAM resources, such as self-hosted CI/CD runners or provisioning hosts
level: high
