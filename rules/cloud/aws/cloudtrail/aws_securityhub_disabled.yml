title: Suspicious AWS Security Hub Deactivation
id: 3475e0e1-5423-478e-9c12-2ce590e558a4
status: experimental
description: |
    Detects when AWS Security Hub is disabled in an account and region.
    Disabling Security Hub stops the aggregation of security findings, which adversaries may use to avoid detection.
references:
    - https://docs.aws.amazon.com/securityhub/1.0/APIReference/API_DisableSecurityHub.html
    - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/49dae1447e92cf1a65390b52f95fed6c15f41d2f/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-security-hub-post-exploitation/README.md
    - https://tocconsulting.fr/security-cards/securityhub
author: elhoim
date: 2026-10-15
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'securityhub.amazonaws.com'
        eventName: 'DisableSecurityHub'
    condition: selection
falsepositives:
    - Legitimate decommissioning of Security Hub in an unused region or account
level: high
