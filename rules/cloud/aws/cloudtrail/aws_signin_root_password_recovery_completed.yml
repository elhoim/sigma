title: AWS Root Account Password Recovery Completed
id: d1dd2016-fe4d-466a-8af9-94f2a98a234a
status: experimental
description: |
    Detects a completed password recovery for the AWS account root user.
    Adversaries who gained access to the mailbox of the root user email address can reset the root password to take over the account.
references:
    - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/reset-root-password.html
    - https://docs.datadoghq.com/security/default_rules/def-000-5if/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'signin.amazonaws.com'
        eventName: 'PasswordRecoveryCompleted'
    condition: selection
falsepositives:
    - Legitimate root password reset by the account owner
level: high
