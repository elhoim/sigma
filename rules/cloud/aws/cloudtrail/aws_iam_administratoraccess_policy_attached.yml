title: AWS IAM AdministratorAccess Policy Attached To Principal
id: 9e972cdf-eb39-4ff3-baf4-9d34b6d8e8cf
status: experimental
description: |
    Detects the attachment of the AWS managed "AdministratorAccess" policy to an IAM user, group or role.
    Adversaries with sufficient IAM permissions may grant themselves or a backdoor principal full administrative access to the account.
references:
    - https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AdministratorAccess.html
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_AttachRolePolicy.html
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'iam.amazonaws.com'
        eventName:
            - 'AttachGroupPolicy'
            - 'AttachRolePolicy'
            - 'AttachUserPolicy'
        requestParameters.policyArn: 'arn:aws:iam::aws:policy/AdministratorAccess'
    condition: selection
falsepositives:
    - Legitimate administrator onboarding or infrastructure-as-code deployments assigning administrative roles
level: medium
