title: AWS IAM AmazonSESFullAccess Policy Attached To Principal
id: 6489576e-e1b8-4627-b064-63230921bc3d
status: experimental
description: |
    Detects the attachment of the AWS managed "AmazonSESFullAccess" policy to an IAM user, group or role.
    Adversaries using compromised credentials grant themselves SES permissions to abuse the account for phishing or spam campaigns.
references:
    - https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AmazonSESFullAccess.html
    - https://docs.aws.amazon.com/IAM/latest/APIReference/API_AttachUserPolicy.html
    - https://docs.datadoghq.com/security/default_rules/def-000-4or/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.003
logsource:
    product: aws
    service: cloudtrail
detection:
    selection:
        eventSource: 'iam.amazonaws.com'
        eventName:
            - 'AttachGroupPolicy'
            - 'AttachRolePolicy'
            - 'AttachUserPolicy'
        requestParameters.policyArn: 'arn:aws:iam::aws:policy/AmazonSESFullAccess'
    condition: selection
falsepositives:
    - Legitimate setup of email sending applications
level: medium
