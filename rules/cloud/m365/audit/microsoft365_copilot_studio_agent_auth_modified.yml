title: Copilot Studio Agent Authentication Settings Modified
id: 38210d21-5fae-4fbb-a9b8-9faa21a59f3b
status: experimental
description: |
    Detects changes to the authentication settings of a Microsoft Copilot Studio agent.
    Adversaries may change an agent's authentication, for example to disable user authentication or to point it to an identity provider they control, in order to expose the agent publicly or to phish OAuth tokens through it.
references:
    - https://learn.microsoft.com/en-us/microsoft-copilot-studio/admin-logging-copilot-studio
    - https://learn.microsoft.com/en-us/microsoft-copilot-studio/configuration-end-user-authentication
    - https://docs.datadoghq.com/security/default_rules/def-000-9yz/
author: elhoim
date: 2026-10-15
tags:
    - attack.defense-impairment
    - attack.persistence
    - attack.credential-access
    - attack.t1556
logsource:
    service: audit
    product: m365
detection:
    selection:
        Operation|endswith: 'BotUpdateOperation-BotAuthUpdate'
    condition: selection
falsepositives:
    - Legitimate configuration of agents by makers or administrators
level: medium
