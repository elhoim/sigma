title: Google Workspace Admin Role Assigned
id: 1a6dd7a8-2e17-472f-9bed-b99455b9c7b9
status: experimental
description: |
    Detects the assignment of an administrator role to a user in Google Workspace.
    Adversaries may assign administrator roles to accounts they control to escalate privileges or maintain persistence.
references:
    - https://developers.google.com/workspace/admin/reports/v1/appendix/activity/admin-delegated-admin-settings#ASSIGN_ROLE
    - https://docs.datadoghq.com/security/default_rules/def-000-v89/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.003
logsource:
    product: gcp
    service: google_workspace.admin
detection:
    selection:
        eventService: 'admin.googleapis.com'
        eventName: 'ASSIGN_ROLE'
    condition: selection
falsepositives:
    - Legitimate delegation of administrative privileges
level: medium
