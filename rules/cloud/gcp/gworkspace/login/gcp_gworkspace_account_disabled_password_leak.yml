title: Google Workspace Account Disabled Due To Password Leak
id: 9dc0f6e5-36ae-43dd-86fd-704591e28125
status: experimental
description: |
    Detects when Google disables a Workspace account because its password was found in a leak.
    The credentials of the account should be considered compromised and previous sign-in activity should be reviewed.
references:
    - https://developers.google.com/workspace/admin/reports/v1/appendix/activity/login#account_disabled_password_leak
author: elhoim
date: 2026-10-15
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1078.004
logsource:
    product: gcp
    service: google_workspace.login
detection:
    selection:
        protoPayload.serviceName: 'login.googleapis.com'
        protoPayload.metadata.event.eventName: 'account_disabled_password_leak'
    condition: selection
falsepositives:
    - Unknown
level: medium
