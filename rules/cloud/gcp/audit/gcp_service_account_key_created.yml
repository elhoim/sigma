title: GCP Service Account Key Created
id: 3fe2b359-bbf4-42d3-b736-c5427265c67b
status: experimental
description: |
    Detects the creation of a user-managed key for a GCP service account.
    Service account keys are long-lived credentials that adversaries create to maintain persistent access to a project.
references:
    - https://cloud.google.com/iam/docs/keys-create-delete
    - https://cloud.google.com/iam/docs/audit-logging/examples-service-accounts
    - https://docs.datadoghq.com/security/default_rules/c17-28f-69c/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.001
logsource:
    product: gcp
    service: gcp.audit
detection:
    selection:
        gcp.audit.method_name: 'google.iam.admin.v1.CreateServiceAccountKey'
    condition: selection
falsepositives:
    - Legitimate creation of keys for workloads running outside of Google Cloud
level: medium
