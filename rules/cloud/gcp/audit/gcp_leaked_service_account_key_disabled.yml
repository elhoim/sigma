title: GCP Service Account Key Disabled Due To Public Exposure
id: 31ca647b-231c-4908-a4d6-0a6d5ed846f9
status: experimental
description: |
    Detects when Google automatically disables a service account key after detecting that it has been publicly exposed, for example in a public code repository.
    The key should be considered compromised and any activity performed with it should be reviewed.
references:
    - https://cloud.google.com/iam/docs/key-compromise-response
    - https://cloud.google.com/resource-manager/docs/organization-policy/restricting-service-accounts#disable-exposed-keys
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1552.001
logsource:
    product: gcp
    service: gcp.audit
detection:
    selection:
        gcp.audit.method_name: 'google.iam.admin.v1.DisableServiceAccountKey'
        data.protoPayload.authenticationInfo.principalEmail: 'gcp-compromised-key-response@system.gserviceaccount.com'
    condition: selection
falsepositives:
    - Unlikely
level: high
