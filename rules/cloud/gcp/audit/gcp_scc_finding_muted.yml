title: GCP Security Command Center Finding Muted or Mute Rule Created
id: 8d4e21d9-0fca-4267-8136-8f9a241b4d2c
status: experimental
description: |
    Detects when Security Command Center findings are muted individually or in bulk, or when a mute configuration (mute rule) is created or updated.
    Adversaries may mute findings to hide alerts generated by their activity from defenders.
    Note that "SetMute" and "BulkMuteFindings" are recorded in Data Access audit logs, which must be enabled for Security Command Center.
references:
    - https://cloud.google.com/security-command-center/docs/audit-logging
    - https://cloud.google.com/security-command-center/docs/how-to-mute-findings
    - https://docs.datadoghq.com/security/default_rules/def-000-ojd/
author: elhoim
date: 2026-10-15
tags:
    - attack.defense-impairment
    - attack.t1685
logsource:
    product: gcp
    service: gcp.audit
detection:
    selection:
        gcp.audit.method_name|endswith:
            - .SecurityCenter.SetMute
            - .SecurityCenter.BulkMuteFindings
            - .SecurityCenter.CreateMuteConfig
            - .SecurityCenter.UpdateMuteConfig
    condition: selection
falsepositives:
    - Security teams muting findings or creating mute rules to reduce noise from accepted risks
    - The "SetMute" method is also used to unmute findings
level: medium
