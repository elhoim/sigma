title: Password Reset By User Account
id: 340ee172-4b67-4fb4-832f-f961bdc1f3aa
status: test
description: Detect when a user has reset their password in Azure AD
references:
    - https://learn.microsoft.com/en-us/entra/architecture/security-operations-privileged-accounts
author: YochanaHenderson, '@Yochana-H', elhoim - David André (correction)
date: 2022-08-03
modified: 2026-09-24
tags:
    - attack.privilege-escalation
    - attack.initial-access
    - attack.persistence
    - attack.credential-access
    - attack.stealth
    - attack.t1078.004
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        Category: 'UserManagement'
        Status: 'Success'
        OperationName:
            - 'Change password (self-service)'
            - 'Reset password (self-service)'
            - 'Change user password'
            - 'Reset user password'
    selection_self:
        # The user resetting the password is also the target of the operation
        InitiatedBy.user.userPrincipalName|fieldref: TargetResources.userPrincipalName
    condition: all of selection*
falsepositives:
    - If this was approved by System Administrator or confirmed user action.
level: medium
