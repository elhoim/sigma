title: Member Added To Entra Restricted Management Administrative Unit
id: 4fe99d51-a539-494c-9ae8-ff64c75f3a4c
status: experimental
description: |
    Detects when an object is added to a restricted management administrative unit in Microsoft Entra ID.
    Objects in such units cannot be modified by tenant-scoped administrators, including Global Administrators. Adversaries may place a backdoor account in a restricted management administrative unit to protect it from remediation.
references:
    - https://learn.microsoft.com/en-us/entra/identity/role-based-access-control/admin-units-restricted-management
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message: 'Add member to restricted management administrative unit'
    condition: selection
falsepositives:
    - Legitimate protection of sensitive accounts by administrators
level: medium
