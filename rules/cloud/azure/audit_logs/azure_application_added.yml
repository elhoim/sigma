title: New Application Registered In Entra ID
id: 55620223-bd98-4e5b-a450-aeab8b3f5214
related:
    - id: 0ddcff6d-d262-40b0-804b-80eb592de8e3 # Azure Service Principal Created
      type: similar
status: experimental
description: |
    Detects when a new application is registered in Microsoft Entra ID.
    Adversaries may register applications in a compromised tenant and grant them permissions to keep access to Microsoft 365 data independently of the compromised user accounts.
references:
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities#core-directory
    - https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications
    - https://docs.datadoghq.com/security/default_rules/kc5-vk1-ysw/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.t1671
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message: 'Add application'
    condition: selection
falsepositives:
    - Legitimate application registrations by developers and administrators
level: low
