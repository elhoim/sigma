title: Federated Identity Credential Added To Entra Application
id: aaa81dcb-8e78-4a6f-94e0-29523d56ea74
status: experimental
description: |
    Detects when a federated identity credential is added to or modified on an application registration in Microsoft Entra ID.
    A federated identity credential trusts tokens issued by an external identity provider, such as GitHub Actions or another Entra tenant, for a given subject.
    Adversaries may add a federated identity credential pointing to an issuer they control to authenticate as the application without any secret or certificate.
references:
    - https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities#core-directory
    - https://docs.datadoghq.com/security/default_rules/def-000-y2u/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.001
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message: 'Update application'
        TargetResources.modifiedProperties|contains: 'FederatedIdentityCredentials'
    condition: selection
falsepositives:
    - Legitimate configuration of workload identity federation for CI/CD pipelines or Kubernetes workloads
level: medium
