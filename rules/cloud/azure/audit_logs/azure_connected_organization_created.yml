title: Potential Cross-Tenant Access Via Entra Connected Organization Creation
id: 8432b0eb-eb35-4011-ad4b-710f4f6513d9
status: experimental
description: |
    Detects the creation of a connected organization in Microsoft Entra entitlement management.
    A connected organization allows users of an external tenant or domain to request access packages. Adversaries with Identity Governance privileges may add their own tenant to obtain persistent cross-tenant access.
references:
    - https://learn.microsoft.com/en-us/entra/id-governance/entitlement-management-organization
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
    - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/2191a33356076d0232462d44a0556d8ccf4f18f5/src/pentesting-cloud/azure-security/az-persistence/az-entra-id-governance-persistence.md
    - https://securitylabs.datadoghq.com/articles/entra-access-packages-part-1-privileges/
author: elhoim
date: 2026-10-15
tags:
    - attack.initial-access
    - attack.persistence
    - attack.t1199
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        operationName: 'Create connected organization'
    condition: selection
falsepositives:
    - Legitimate onboarding of a partner organization
level: medium
