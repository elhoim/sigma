title: Owner Added To Entra Service Principal
id: 4de0e225-3387-4286-a005-b9dc813e5794
status: experimental
description: |
    Detects when an owner is added to a service principal (enterprise application) in Microsoft Entra ID.
    Owners can manage the credentials of the service principal, which adversaries abuse to authenticate as the application and inherit its permissions.
references:
    - https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/assign-app-owners
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.001
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message: 'Add owner to service principal'
    condition: selection
falsepositives:
    - Legitimate delegation of application management
level: medium
