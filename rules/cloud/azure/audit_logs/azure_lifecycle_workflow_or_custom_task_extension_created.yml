title: Entra Lifecycle Workflow or Custom Task Extension Created
id: 5f78fa1c-5987-401c-9695-eebccedd5fd4
status: experimental
description: |
    Detects the creation of a Lifecycle Workflow or of a custom task extension in Microsoft Entra ID Governance.
    Lifecycle Workflows run automated tasks against users, such as generating a Temporary Access Pass or adding group memberships, and custom task extensions call out to an Azure Logic App.
    Adversaries with Lifecycle Workflows Administrator privileges may abuse them to automatically grant themselves access or run arbitrary logic when users join, move or leave.
references:
    - https://learn.microsoft.com/en-us/entra/id-governance/lifecycle-workflow-audits
    - https://learn.microsoft.com/en-us/entra/id-governance/lifecycle-workflow-extensibility
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities#lifecycle-workflows
    - https://docs.datadoghq.com/security/default_rules/def-000-4qq/
    - https://docs.datadoghq.com/security/default_rules/def-000-z8r/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        properties.message:
            - 'Create custom task extension'
            - 'Create workflow'
    condition: selection
falsepositives:
    - Legitimate identity governance automation configured by administrators
level: medium
