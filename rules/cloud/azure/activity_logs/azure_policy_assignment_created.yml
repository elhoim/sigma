title: Azure Policy Assignment Created or Modified
id: 291171f8-0f37-4e0f-9764-13ca702c84fc
status: experimental
description: |
    Detects the creation or modification of an Azure Policy assignment.
    Adversaries with sufficient privileges may assign policies with "deployIfNotExists" or "modify" effects to deploy or alter resources across a scope, or assign policies that weaken security controls.
references:
    - https://learn.microsoft.com/en-us/azure/governance/policy/concepts/assignment-structure
    - https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/management-and-governance
    - https://docs.datadoghq.com/security/default_rules/f72-zu8-tjj/
author: elhoim
date: 2026-10-15
tags:
    - attack.defense-impairment
    - attack.privilege-escalation
    - attack.t1484
logsource:
    product: azure
    service: activitylogs
detection:
    selection:
        operationName: 'MICROSOFT.AUTHORIZATION/POLICYASSIGNMENTS/WRITE'
    condition: selection
falsepositives:
    - Legitimate governance changes by cloud administrators or infrastructure-as-code pipelines
level: low
