title: Potential Privilege Escalation Via OneLogin Privilege Granted To User
id: 5564542d-7a3e-41eb-942b-5102d39d7bc0
status: experimental
description: |
    Detects when a OneLogin privilege or delegated privilege, such as an administrative privilege, is granted directly to a user, through the admin portal or the API.
    Attackers may grant privileges to accounts under their control in order to escalate privileges or maintain persistence.
references:
    - https://developers.onelogin.com/api-docs/1/events/event-types
    - https://github.com/Azure/Azure-Sentinel/blob/96b0d8db6205df266093560117d254a1c29c9170/Solutions/OneLoginIAM/Parsers/OneLogin.yaml
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: onelogin
    service: onelogin.events
detection:
    selection:
        event_type_id:
            - 72 # PRIVILEGE_GRANTED_TO_USER
            - 2106 # DELEGATED_PRIVILEGE_ASSIGNED_TO_USER_VIA_API
            - 2107 # DELEGATED_PRIVILEGE_ASSIGNED_TO_USER_BY_USER
    condition: selection
falsepositives:
    - Legitimate privilege assignments by administrators
level: medium
