title: OneLogin API Credential Created or Enabled
id: a6fe1224-ab4a-45f7-897a-fd12c798cdc1
status: experimental
description: |
    Detects when a OneLogin API credential is created or enabled.
    Attackers with administrative access may create API credentials to maintain persistent programmatic access to the OneLogin tenant.
references:
    - https://developers.onelogin.com/api-docs/1/events/event-types
    - https://docs.datadoghq.com/security/default_rules/def-008-4ba/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.001
logsource:
    product: onelogin
    service: onelogin.events
detection:
    selection:
        event_type_id:
            - 179 # API_CREDENTIAL_CREATED
            - 181 # API_CREDENTIAL_ENABLED
    condition: selection
falsepositives:
    - Legitimate creation of API credentials by administrators for integrations
level: medium
