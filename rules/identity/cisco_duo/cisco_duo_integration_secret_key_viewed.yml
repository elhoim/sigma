title: Cisco Duo Application Secret Key Viewed
id: 2b59439b-e4c4-4559-a613-f3d1face0540
status: experimental
description: |
    Detects when a Duo administrator views the secret key or client ID of a protected application (integration) in plain text, either via the Admin Panel or via the Admin API.
    With an application's integration key, secret key and API hostname, an attacker can call Duo APIs on behalf of that application, for example the Admin API to read and modify the Duo configuration.
references:
    - https://duo.com/docs/adminapi#administrator-logs
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1552
logsource:
    product: cisco
    service: duo
detection:
    selection:
        action:
            - 'integration_skey_bulk_view'
            - 'integration_skey_view'
    condition: selection
falsepositives:
    - Administrators legitimately retrieving an application secret key while deploying or reconfiguring a Duo integration
level: medium
