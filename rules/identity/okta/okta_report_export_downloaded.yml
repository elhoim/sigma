title: Okta Report Export Downloaded
id: a500c114-32ee-4148-8132-141e95feb3bd
status: experimental
description: |
    Detects when a user downloads an export file generated by Okta for a report available in the admin console.
    Report exports may contain sensitive information about users, applications and authentication activity that is useful for reconnaissance.
references:
    - https://developer.okta.com/docs/reference/api/event-types/
    - https://docs.datadoghq.com/security/default_rules/def-000-4jz/
author: elhoim
date: 2026-10-15
tags:
    - attack.collection
    - attack.t1213
logsource:
    product: okta
    service: okta
detection:
    selection:
        eventType: 'analytics.reports.export.download'
        outcome.result: 'SUCCESS'
    condition: selection
falsepositives:
    - Administrators legitimately exporting reports for audit or compliance purposes
level: low
