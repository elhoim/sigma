title: Okta Application or Identity Provider Client Secret Read
id: 923161e5-403a-4826-9633-a9965809cff4
status: experimental
description: |
    Detects when the client secret of an Okta OAuth client, an MFA-only application or an identity provider is read.
    Attackers with administrative access may read client secrets in order to impersonate applications and obtain tokens.
references:
    - https://developer.okta.com/docs/reference/api/event-types/
    - https://docs.datadoghq.com/security/default_rules/def-000-cew/
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1528
logsource:
    product: okta
    service: okta
detection:
    selection:
        eventType:
            - 'app.oauth2.client.read_client_secret'
            - 'application.configuration.read_client_secret'
            - 'system.idp.lifecycle.read_client_secret'
    condition: selection
falsepositives:
    - Administrators or automation legitimately retrieving client secrets, for example via the client credentials management API
level: medium
