title: Okta SWA Application Password Revealed
id: 25874d66-a216-4033-a585-1f086a2fefb2
status: experimental
description: |
    Detects when the password of a Secure Web Authentication (SWA) application assigned to a user is revealed in plaintext.
    Adversaries with access to an Okta session can reveal stored application passwords to access downstream applications.
references:
    - https://developer.okta.com/docs/reference/api/event-types/
    - https://help.okta.com/en-us/content/topics/apps/apps_about_swa.htm
    - https://docs.datadoghq.com/security/default_rules/def-000-v9m/
author: elhoim
date: 2026-10-15
tags:
    - attack.credential-access
    - attack.t1555
logsource:
    product: okta
    service: okta
detection:
    selection:
        eventType: 'application.user_membership.show_password'
        outcome.result: 'SUCCESS'
    condition: selection
falsepositives:
    - Users legitimately viewing their own application passwords
level: medium
