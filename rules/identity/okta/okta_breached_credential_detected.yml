title: Okta Breached Credential Detected
id: dfbbfa8f-de1b-4c8c-8f6f-e1790a0b9c15
status: experimental
description: |
    Detects when Okta identifies that a credential associated with a known breach was used during an authentication flow.
    The actor of the event is the user owning the breached credential, which should be rotated.
references:
    - https://developer.okta.com/docs/reference/api/event-types/
author: elhoim
date: 2026-10-15
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1078.004
logsource:
    product: okta
    service: okta
detection:
    selection:
        eventType: 'security.breached_credential.detected'
    condition: selection
falsepositives:
    - Legitimate users reusing a password that appears in a public breach corpus
level: medium
