title: Okta Privileged Access Server Account Password Changed Out of Band
id: 02877acb-3864-42f4-983e-714181e66e4e
status: experimental
description: |
    Detects when a server account password managed by Okta Privileged Access is altered by a method other than the scheduled rotation.
    This may indicate an unauthorized user resetting a local server account password to gain access to a server.
references:
    - https://developer.okta.com/docs/reference/api/event-types/
    - https://docs.datadoghq.com/security/default_rules/def-000-vqw/
author: elhoim
date: 2026-10-15
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
logsource:
    product: okta
    service: okta
detection:
    selection:
        eventType: 'pam.server_account.password_change.out_of_band'
    condition: selection
falsepositives:
    - Server administrators manually changing local account passwords outside of Okta Privileged Access
level: medium
